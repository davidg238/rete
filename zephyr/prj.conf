# tuvm/zephyr — native_sim bring-up gate (Task 7). Minimal console + a
# generous main stack + heap for the VM arena. No OpenThread (native_sim has
# no radio); no USB-CDC (native_sim's console is the host's own stdout).
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc with malloc/realloc/free, setjmp, snprintf, FP printf for the VM.
# native_sim selects picolibc by default; NEWLIB_LIBC is a no-op but harmless
# (mirrors ns-zephyr/app/prj_nativesim.conf's own note).
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_MAIN_STACK_SIZE=16384

# Networking: src/dispatch.c's send() fast path unconditionally probes
# `receiver == udp_object()`, so src/udp.c + src/backend/zephyr/udp_zephyr.c
# must link even though this gate's node never grants a `net` capability.
# native_sim offloaded sockets (NSOS) — verbatim from
# ns-zephyr/app/prj_nativesim.conf, the proven native_sim UDP recipe on this
# workspace. No CONFIG_POSIX_API: it exports a bare `send()` that collides
# with oevm's own `send()` dispatch function in dispatch.c.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
