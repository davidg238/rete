<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <style>
    .wire  { stroke:#111; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .comp  { stroke:#111; stroke-width:3.5; fill:none; stroke-linecap:round }
    .fill  { fill:#111; stroke:none }
    .box   { fill:#fff; stroke:#111; stroke-width:3 }
    .lbl   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; fill:#111 }
    .val   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#111 }
    .pin   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; font-weight:bold; fill:#111 }
    .note  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#1a4f8a }
    .warn  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#b3261e }
    .title { font-family:'DejaVu Sans',Arial,sans-serif; font-size:27px; font-weight:bold; fill:#111 }
    .sub   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#444 }
    .step  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#111 }
  </style>

  <rect x="0" y="0" width="1400" height="1040" fill="#ffffff"/>

  <text class="title" x="40" y="44">Ship's bell v3 — 12 V bench strike driver (high-side P-channel)</text>
  <text class="sub"   x="40" y="74">Parts on hand: IRF9Z14 · 2N3904 · 1N5819 · two resistors.   Load = REAR solenoid of the doorbell chime.</text>

  <!-- ===== +12 V rail ===== -->
  <line class="wire" x1="170" y1="120" x2="860" y2="120"/>
  <circle class="fill" cx="170" cy="120" r="7"/>
  <text class="val"  x="186" y="150">+12 V</text>
  <text class="note" x="186" y="174">bench supply — limit to 2 A if you can</text>

  <!-- ===== GND rail ===== -->
  <line class="wire" x1="170" y1="700" x2="1150" y2="700"/>
  <line class="wire" x1="560" y1="700" x2="560" y2="726"/>
  <line class="comp" x1="530" y1="726" x2="590" y2="726"/>
  <line class="comp" x1="540" y1="737" x2="580" y2="737"/>
  <line class="comp" x1="550" y1="748" x2="570" y2="748"/>
  <text class="val" x="600" y="734">GND</text>

  <!-- ===== MagTag ===== -->
  <rect class="box" x="60" y="420" width="190" height="140" rx="8"/>
  <text class="lbl" x="80" y="470">MagTag</text>
  <text class="lbl" x="80" y="498">ESP32-S2</text>
  <text class="pin" x="242" y="484" text-anchor="end">GPIO</text>
  <text class="pin" x="242" y="524" text-anchor="end">GND</text>
  <line class="wire" x1="250" y1="490" x2="310" y2="490"/>
  <line class="wire" x1="250" y1="530" x2="280" y2="530"/>
  <line class="wire" x1="280" y1="530" x2="280" y2="700"/>
  <circle class="fill" cx="280" cy="700" r="6"/>

  <!-- ===== R1 base resistor ===== -->
  <rect class="box" x="310" y="472" width="76" height="36"/>
  <text class="val" x="348" y="462" text-anchor="middle">10 k</text>
  <text class="lbl" x="348" y="534" text-anchor="middle">R1</text>
  <line class="wire" x1="386" y1="490" x2="448" y2="490"/>

  <!-- ===== 2N3904 ===== -->
  <circle class="comp" cx="480" cy="490" r="45"/>
  <line class="comp" x1="448" y1="456" x2="448" y2="524"/>
  <line class="wire" x1="448" y1="470" x2="496" y2="442"/>
  <line class="wire" x1="448" y1="510" x2="496" y2="538"/>
  <polygon class="fill" points="496,538 479,533 486,523"/>
  <line class="wire" x1="496" y1="442" x2="496" y2="330"/>
  <line class="wire" x1="496" y1="538" x2="496" y2="700"/>
  <circle class="fill" cx="496" cy="700" r="6"/>
  <text class="pin" x="424" y="452">B</text>
  <text class="pin" x="510" y="428">C</text>
  <text class="pin" x="510" y="566">E</text>
  <text class="val" x="524" y="616">2N3904</text>
  <text class="lbl" x="524" y="642">NPN — level shifter</text>

  <!-- ===== R2 gate pull-up ===== -->
  <line class="wire" x1="640" y1="120" x2="640" y2="190"/>
  <rect class="box" x="622" y="190" width="36" height="72"/>
  <line class="wire" x1="640" y1="262" x2="640" y2="330"/>
  <circle class="fill" cx="640" cy="120" r="6"/>
  <text class="val" x="606" y="206" text-anchor="end">10 k</text>
  <text class="lbl" x="606" y="232" text-anchor="end">R2 —</text>
  <text class="lbl" x="606" y="258" text-anchor="end">holds gate OFF</text>

  <!-- ===== R3 gate series ===== -->
  <rect class="box" x="530" y="312" width="70" height="36"/>
  <text class="val" x="565" y="302" text-anchor="middle">1 k</text>
  <text class="lbl" x="565" y="374" text-anchor="middle">R3</text>
  <line class="wire" x1="496" y1="330" x2="530" y2="330"/>
  <line class="wire" x1="600" y1="330" x2="640" y2="330"/>
  <circle class="fill" cx="640" cy="330" r="6"/>

  <!-- gate lead -->
  <line class="wire" x1="640" y1="330" x2="760" y2="330"/>

  <!-- ===== IRF9Z14 P-channel MOSFET ===== -->
  <line class="comp" x1="760" y1="272" x2="760" y2="388"/>
  <line class="comp" x1="784" y1="272" x2="784" y2="306"/>
  <line class="comp" x1="784" y1="312" x2="784" y2="348"/>
  <line class="comp" x1="784" y1="354" x2="784" y2="388"/>
  <line class="wire" x1="784" y1="289" x2="860" y2="289"/>
  <line class="wire" x1="784" y1="330" x2="860" y2="330"/>
  <polygon class="fill" points="840,330 822,323 822,337"/>
  <line class="wire" x1="860" y1="120" x2="860" y2="330"/>
  <circle class="fill" cx="860" cy="289" r="6"/>
  <line class="wire" x1="784" y1="371" x2="1150" y2="371"/>
  <text class="pin" x="734" y="264">G</text>
  <text class="pin" x="806" y="278">S</text>
  <text class="pin" x="806" y="402">D</text>
  <text class="val"  x="560" y="480">IRF9Z14</text>
  <text class="lbl"  x="560" y="506">P-channel, 60 V, 6.7 A</text>
  <text class="note" x="560" y="532">ON when its gate is pulled low</text>
  <text class="note" x="560" y="558">gate:  12 V idle  →  0 V driven</text>
  <text class="note" x="1020" y="346" text-anchor="middle">probe this node during bring-up</text>

  <!-- ===== solenoid ===== -->
  <circle class="fill" cx="1010" cy="371" r="6"/>
  <line class="wire" x1="1010" y1="371" x2="1010" y2="440"/>
  <path class="comp" d="M 1010 440 A 16 16 0 0 1 1010 472 A 16 16 0 0 1 1010 504 A 16 16 0 0 1 1010 536 A 16 16 0 0 1 1010 568"/>
  <line class="wire" x1="1010" y1="568" x2="1010" y2="700"/>
  <circle class="fill" cx="1010" cy="700" r="6"/>
  <text class="val" x="985" y="480" text-anchor="end">REAR</text>
  <text class="val" x="985" y="506" text-anchor="end">solenoid</text>
  <text class="lbl" x="985" y="534" text-anchor="end">single-note</text>

  <!-- ===== 1N5819 flyback ===== -->
  <line class="wire" x1="1150" y1="371" x2="1150" y2="470"/>
  <line class="comp" x1="1118" y1="470" x2="1182" y2="470"/>
  <polygon class="comp" points="1118,522 1182,522 1150,470" fill="#fff"/>
  <line class="wire" x1="1150" y1="522" x2="1150" y2="700"/>
  <circle class="fill" cx="1150" cy="700" r="6"/>
  <text class="val"  x="1200" y="464">1N5819</text>
  <text class="warn" x="1200" y="492">BANDED END</text>
  <text class="warn" x="1200" y="516">goes UP, to</text>
  <text class="warn" x="1200" y="540">the drain node</text>

  <!-- ===== notes ===== -->
  <line x1="40" y1="778" x2="1360" y2="778" stroke="#bbb" stroke-width="2"/>
  <text class="val"  x="40" y="814">How it behaves — and the order to do it in</text>
  <text class="step" x="40" y="846">1.  FIRST, with everything unpowered: measure the rear solenoid's DC resistance. 8–15 Ω decides whether 12 V is rated drive or half of it.</text>
  <text class="step" x="40" y="874">2.  GPIO low, or MagTag unplugged  →  R2 holds the gate at +12 V  →  V_GS = 0  →  MOSFET OFF. The coil cannot energise.</text>
  <text class="step" x="40" y="902">3.  GPIO high  →  2N3904 saturates  →  gate pulled to ~0 V  →  V_GS = −12 V  →  MOSFET fully ON (~0.5 Ω, so the coil sees ~11.4 V).</text>
  <text class="step" x="40" y="930">4.  The 12 V supply's negative MUST tie to MagTag GND, or the gate drive has no reference.</text>
  <text class="step" x="40" y="958">5.  Bring up with the COIL DISCONNECTED: drain node reads 0 V idle, ~11.5 V driven, and 0 V again with the MagTag unplugged.</text>
  <text class="step" x="40" y="986">6.  Then fit the coil and walk the ladder: 100 → 50 → 30 → 25 → 20 → 15 → 10 ms. Never on &gt;1 s; 10 s between strikes (~10 W while held).</text>
</svg>
