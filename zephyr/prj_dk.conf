# tuvm/zephyr — Task 8 (nRF52840-DK acceptance bar) Kconfig.
#
# Selected explicitly with `west build -b nrf52840dk/nrf52840 -- -DCONF_FILE=prj_dk.conf`
# so the native_sim gate's prj.conf (Task 7) is NOT consulted — its NSOS
# offloaded-sockets block is native_sim-only and has no meaning on silicon. This
# file is the on-target counterpart: the SAME engine + zephyr backend, but with
# the console on the DK's uart0/VCOM and Zephyr's REAL in-kernel UDP stack over a
# loopback interface (the proven nRF52840 recipe from
# ns-zephyr/app/prj_dongle_loopback.conf).

# Console on uart0 -> the DK's on-board SEGGER VCOM (/dev/ttyACM0 on the host).
# This is the DK board default; stated explicitly for provenance. No USB-CDC:
# the DK routes its console to uart0, unlike the dongle.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc with malloc/realloc/free, setjmp, snprintf, FP printf for the VM arena.
# Sizes trimmed for the nRF52840's 256 KB SRAM (the native_sim gate's 64 KB pool
# / 16 KB stack are host-generous): the VM's own arena is the static
# `oevm_heap_store` (gc.c), sized by the OEVM_HEAP_SIZE compile-def passed via
# env at build time (65536 here — ~72 KB incl. the 1-bit-per-granule GC bitmap),
# NOT by CONFIG_HEAP_MEM_POOL_SIZE (that is Zephyr's own k_malloc pool, used by
# the net stack). 16 KB pool + 8 KB main stack mirror ns-zephyr's proven
# nRF52840 loopback config.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FPU=y

# GPIO: the on-board BUTTON1 (P0.11) is the physical edge source. The board DTS
# already enables gpio0; the overlay adds the `pulsegpio` alias onto button0.
CONFIG_GPIO=y

# Networking: Zephyr's in-kernel IPv6 + IPv4 UDP over a loopback interface —
# same reason as the native_sim gate, src/dispatch.c's send() fast path
# unconditionally probes `receiver == udp_object()`, so src/udp.c +
# src/backend/zephyr/udp_zephyr.c must LINK even though this gate's node grants
# no `net` capability. On silicon that means the real stack (no NSOS). NO
# CONFIG_POSIX_API: it exports a bare send() that collides with oevm's own
# send() dispatch function. Verbatim from ns-zephyr/app/prj_dongle_loopback.conf.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV6_ADDR="::1"
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="127.0.0.1"
# Buffer counts trimmed vs the dongle recipe: this gate NEVER moves a packet
# (the net stack is present only so udp_zephyr.c's zsock_* references link), so
# the minimum that boots the loopback interface is enough — saves SRAM for the
# VM arena on the 256 KB part.
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
