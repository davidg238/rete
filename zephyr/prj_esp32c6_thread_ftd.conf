# Full Thread Device, layered ON TOP of prj_esp32c6_thread.conf.
#
# An FTD keeps its RLOC routing state and can become a Router/REED, so it routes
# for other nodes and holds the mesh together; an MTD is a leaf that depends on a
# parent and cannot. For a mains-powered bell that sits in one place all day, FTD
# is the useful role — the reason to be an MTD is a battery, and §16.1 says this
# version is wall-powered precisely because of the striker.
#
# Usage (the two fragments are semicolon-joined; LATER wins, so this must follow):
#   ./run.sh --board esp32c6 --conf-extra "prj_esp32c6_thread.conf;prj_esp32c6_thread_ftd.conf" ...
CONFIG_OPENTHREAD_MTD=n
CONFIG_OPENTHREAD_FTD=y
