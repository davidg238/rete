# Coredump-on-fault overlay for the ESP32. Kept as a recipe, not deleted with the
# crash that motivated it: it is how the fflush fault (EXCCAUSE 28) was localised,
# and it is the tool to reach for the next time a node dies on silicon.
# Applied via -DEXTRA_CONF_FILE=coredump.conf on top of prj_esp32.conf.
# NOT on by default — prj_esp32.conf alone is the normal build.
# The dump is emitted as '#CD:' hex lines over the console using Zephyr's
# low-level logging path (NOT newlib stdio, which the fault gags), so it survives
# the crash. MEMORY_DUMP_MIN = CPU registers (incl. Xtensa EXCCAUSE + the fault
# PC/address) + the faulting thread's stack — enough for a full backtrace and to
# see the bad pointer, while keeping the serial dump short. Decode offline with
# zephyr/scripts/coredump/.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
