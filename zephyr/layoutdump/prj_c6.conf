# layoutdump for the ESP32-C6 ABI. Throwaway app: compiles tools/dump_layout.c
# and prints the struct layout JSON over the console. Output is banked as
# zephyr/layout-esp32c6.json and fed to the Model B bake as --layout.
#
# Separate from prj.conf because that file sets
# CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y for the bench WROOM-32's rev-1.0
# silicon — an ESP32-only symbol.
#
# A layout must be dumped per target because you cannot know it matches until
# you look — NOT because it necessarily differs. Measured outcome on this part:
# the RV32 ilp32 dump is byte-identical to Xtensa, every struct size and field
# offset, struct Float included (16 B, value at offset 8) — no struct here has a
# field whose natural alignment diverges between the two ABIs. A target with
# genuinely different alignment rules would differ; this one did not.
#
# The app is still required: Model B cannot bake without layout-esp32c6.json
# existing, which is why running it is the first C6 flash rather than TimerNode.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PICOLIBC=y
