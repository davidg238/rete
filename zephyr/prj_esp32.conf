# tuvm/zephyr — ESP32 (ESP32-D0WDQ6 / WROOM-32) boot-&-run Kconfig.
#
# Selected with:
#   west build -b esp32_devkitc/esp32/procpu -- -DCONF_FILE=prj_esp32.conf
# built against the upstream-Zephyr workspace ~/zephyr-esp32 (NOT NCS — ESP32 is
# first-class upstream, absent from NCS's manifest). This is the on-silicon
# counterpart to prj_dk.conf: the SAME engine + zephyr backend, console on
# uart0 (the CP210x USB-serial bridge, /dev/ttyUSB0 on the host), and Zephyr's
# REAL in-kernel UDP stack over a loopback interface.
#
# First target node is TimerNode (Rung-8 gate 1): it exercises the REAL
# k_timer ISR path (timer_zephyr.c) and needs NO radio and NO GPIO, so this
# config omits the DK's GPIO block. main.c's GPIO ISR is guarded on
# DT_ALIAS(pulsegpio) — absent here (no board overlay) — so it compiles out;
# OpenThread is guarded on CONFIG_NET_L2_OPENTHREAD (off here).

# Console on uart0 -> the devkit's CP210x USB-serial (/dev/ttyUSB0 on the host).
# esp32_devkitc's board DTS already chooses uart0 as zephyr,console; stated
# explicitly for provenance. Not USB-CDC (classic ESP32 has no native USB), so
# main.c's cdc_acm console branch compiles out.
# The bench board is an ESP32-D0WDQ6 rev v1.0 (early-2016 silicon). The
# hal_espressif SoC bootloader HALTS on rev 1.0 unless this opt-in is set —
# without it the app never gets control (bootloader stops at soc_init). Harmless
# on newer revisions.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc: picolibc (Zephyr's DEFAULT libc — lib/libc/Kconfig defaults PICOLIBC
# unless a target REQUIRES_FULL_LIBC). We deliberately do NOT reuse the nRF DK's
# CONFIG_NEWLIB_LIBC here. NOTE: an earlier revision of this comment blamed the
# 'TIMER OK' crash on newlib lazily mallocing the stream buffer, and claimed
# picolibc "doesn't have this gap". That was WRONG — picolibc crashed
# identically, because the choice of libc never mattered: the ESP32 ROM linker
# script esp32.rom.newlib-funcs.ld assigns `fflush` as a STRONG symbol (plain
# assignment, not PROVIDE — see that file's header comment, which says this is
# deliberate "so that ROM functions are always used instead of the ones provided
# by libc.a"). So fflush bound to ROM newlib no matter what, and ROM fflush
# calls ROM __getreent, which reads an ESP-IDF/FreeRTOS TCB reent pointer that
# does not exist under Zephyr -> NULL load -> EXCCAUSE 28. Verified by nm on
# zephyr.elf: `fflush` is absolute at 0x40059394 (ROM) while printf/fwrite/fputc
# resolve to picolibc at 0x400f____ — fflush was the ONLY stdio call tuvm made
# that appears on that forced list, which is why the text printed and then the
# flush faulted. Fixed at the source: platform_console_flush() is a no-op on
# Zephyr (stdout is _IONBF, so nothing is buffered) — see
# src/backend/zephyr/platform_zephyr.c. picolibc remains the right choice: the
# VM needs malloc/realloc/free, setjmp, snprintf and FP
# printf — all provided by picolibc (CONFIG_PICOLIBC_IO_FLOAT for %g/%f). The
# VM's own arena is the static oevm_heap_store (gc.c), sized by OEVM_HEAP_SIZE at
# build time; RAM tuning reuses the DK's proven env exports. ESP32 has an FPU.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FPU=y

# Networking: WiFi (2.4 GHz WROOM-32 radio) + TCP/IPv4 + DHCPv4 for the HTTP node.
# src/dispatch.c's send() fast path unconditionally probes
# `receiver == udp_object()`, so src/udp.c + src/backend/zephyr/udp_zephyr.c
# must LINK regardless; that path now rides the same WiFi interface as HTTP
# instead of loopback (#46 — see zephyr/src/backend/zephyr/http_zephyr.c and
# main.c's wifi_bringup()). NO CONFIG_POSIX_API: it exports a bare send() that
# collides with oevm's own send() dispatch function in dispatch.c.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y

# WiFi driver + the wifi_mgmt / net_mgmt request API used by wifi_bringup().
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y

# Net-buffer / context counts for a small TCP server. Starting point; trim or
# raise at bring-up if RAM is tight or connections stall (see the design risk).
# TRIMMED (2026-07-18, this task): the brief's starting values (8/8/8/16/16)
# overflowed DRAM by 4776 B once WiFi's own CONFIG_HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI
# (+40960 B system heap for the driver, ESP_WIFI_HEAP_SYSTEM default) is added on
# top of OEVM_HEAP_SIZE. Halved back to the values the pre-WiFi loopback config
# already proved boot clean at this same OEVM_HEAP_SIZE (run.sh's 65536) —
# net_buf pools (CONFIG_NET_BUF_DATA_SIZE=128) dominate the 4776 B, so RX/TX
# 16->8 alone recovers ~2.4 KB; PKT/context halving covers the rest.
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=2048
CONFIG_NET_CONFIG_SETTINGS=n
