# tuvm/zephyr/prj_dongle_thread.conf — Rung 7 (Layer 3), nRF52840 DONGLE port.
# Same NetBridge-over-OpenThread MTD node as the DK, but for the PCA10059 dongle:
# console on the SoC USB-CDC (the dongle has no debugger/VCOM), and picolibc.
# Selected with `-DCONF_FILE=prj_dongle_thread.conf`; the gitignored
# prj_dongle_thread_local.conf overrides the placeholder dataset via -DEXTRA_CONF_FILE.
# See docs/BOARD_PORTS.md + docs/ZEPHYR_LESSONS.md for the why behind every line.
#
# --- Console: SoC USB-CDC ACM (the dongle has no uart0/VCOM) --------------------
#
# "ISSUE A" IS SOLVED, AND IT WAS ONE MISSING KCONFIG LINE (2026-07-11).
#
# It was recorded for two rungs as "the USB-CDC console dies under the radio", with
# picolibc-vs-newlib as the leading suspect. Both were WRONG. The truth:
#
#   CONFIG_USB_DEVICE_STACK_NEXT is Zephyr's NEW USB device stack, and under it the
#   USB device is NOT brought up automatically — something must initialize + enable
#   it. Rung 7 set USB_DEVICE_STACK_NEXT=y + USBD_CDC_ACM_CLASS=y but never set
#   CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y, and src/main.c never called
#   usbd_enable(). So NOTHING ever started USB. It had nothing to do with the radio:
#   the console never enumerated, at any time, under any conditions.
#
# This block is Zephyr's own supported recipe — see zephyr/snippets/cdc-acm-console
# (equivalently: build with `-S cdc-acm-console`). The one load-bearing line is
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT.
#
# CAUTION — UART_LINE_CTRL=y makes the FIRST console write BLOCK until a host opens
# the port and asserts DTR. That is fine when a host is attached (read with pyserial
# dtr=True, NOT `cat`), but it means an UNATTENDED dongle can block on its first
# print. platform_console_write() must therefore never be able to wedge the VM on a
# board whose console has no reader — see src/backend/zephyr/platform_zephyr.c.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y   # bug 1: nothing ever started USB
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_COMPLETE=y

# A fatal error must leave EVIDENCE on the console, not silently reboot into a
# fresh boot that looks like a healthy one (which is how the dongle hid for 2 rungs).
CONFIG_RESET_ON_FATAL_ERROR=n

# libc: picolibc (jast's default; -~12KB flash vs newlib, zero functional cost;
# the leading fix for the dongle Issue A). FP printf still required (VM prints %g).
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
# System heap: OT + mbedTLS + net boot-time allocs draw on this pool (NOT the VM
# arena, sized by OEVM_HEAP_SIZE). 16384 is too small for the OT boot path; 32768.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# GPIO: the dongle's SW1 (P1.06, board button0) is the physical send trigger,
# exposed as the `pulsegpio` alias in boards/nrf52840dongle_nrf52840.overlay.
CONFIG_GPIO=y

# --- Networking: IPv6 UDP over OpenThread (IEEE 802.15.4 mesh), MTD child ------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_OPENTHREAD=y
# MTD, never FTD (FTD's MPSL/radio/RAM weight faulted at boot on the dongle).
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n
# MANUAL_START: the app owns OT bring-up (src/main.c thread_bringup()). On the
# dongle this is doubly important — auto-start's openthread_run() on the BOOT path
# starves USB enumeration. thread_bringup() runs it AFTER the 3s USB settle, then
# calls net_if_up() (the rung-7 ENETDOWN fix).
CONFIG_OPENTHREAD_MANUAL_START=y

# *** THE LINE THAT MAKES A USB-CDC CONSOLE AND A RADIO COEXIST (bug 2). ***
#
# MANUAL_START alone is NOT enough: it only defers openthread_run(). OpenThread's
# SYS_INIT still runs at BOOT, before main() — bringing up the 802.15.4 radio and its
# clocks — and THAT is what stops the SoC USB from ever enumerating. Proven by bisect
# (2026-07-11): stock hello_world + the cdc-acm-console snippet enumerates fine; add
# ONLY this OpenThread block and USB goes dead. Nothing else of ours is involved.
#
# SYS_INIT=n defers OT init entirely to the application, which is the architecture
# src/main.c already implements and could never benefit from: its 3s USB settle was
# pointless while OT had already initialized before main() ran. With this line the boot
# order finally becomes: USB init -> main() -> 3s settle (USB ENUMERATES) ->
# thread_bringup() (openthread_init + openthread_run + net_if_up) -> attach.
#
# thread_bringup() already calls openthread_init(), so it is correct with SYS_INIT off.
# Recovered from st-zephyr's working dongle config (tests/dongle/test-dongle-06-jast-ftd)
# — this is the "jast" technique, and it was the real content of "Issue A" all along.
CONFIG_OPENTHREAD_SYS_INIT=n
CONFIG_MBEDTLS_HEAP_SIZE=10240
# OT init runs PSA/AES-CCM link crypto on this stack; <~3168 -> MPU fault (silent
# boot). 6240 is the proven size.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6240
# NET_CONFIG OFF: its SYS_INIT blocks boot up to 30s waiting for an IPv6 address
# and deadlocks a Thread node (silent boot). The node binds its own sockets.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# --- Thread dataset persistence + the flash-erase lesson -----------------------
# On the dongle the PARTIAL_ERASE lines are CRITICAL (not just tidy): a blocking
# flash erase at boot drops USB CDC IRQs -> CDC never enumerates -> silent boot.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Thread dataset SEED — PLACEHOLDER (OpenThread defaults) --------------------
# SECRET: the REAL porta dataset lives ONLY in the gitignored
# prj_dongle_thread_local.conf, layered via -DEXTRA_CONF_FILE, overriding these.
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_CHANNEL=11
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"
CONFIG_OPENTHREAD_NETWORK_NAME="ot_zephyr"
