# protocol/descriptors/records.yaml — the reading rules for every wire field.
#
# The catalogue (PROTOCOL-NSL-RECORDS.md) says what rides where; MANIFEST.cddl is
# machine-normative for path/kind/class/dir/shape. Neither says how to READ a number,
# and a help desk that returns data without the rule for reading it industrialises
# error at machine speed (custos design D4). This file is that missing half, and
# it is the ONLY authored input to the custos query core's schema.
#
# AUTHORITY AND ORDER — read before editing:
#
#   * Entries are keyed by CDDL RULE (the record SHAPE), not by field name and not by
#     path. Field names collide across shapes — `bootId` is in both Panic and Reset,
#     `image` in App, AppObs and Build, `n` in LatencySpan and SpanCapture — so the
#     flat table the design sketched in §4.4 cannot be keyed on the bare field.
#     One shape can ride several paths (`goal/mode` + `obs/mode`; `sys/latency` +
#     `diag/spans/<span>`), which is why the paths are a list here.
#
#   * `fields:` is IN WIRE ORDER, which is `cval.Encode`'s bytewise sort over the
#     ENCODED key bytes — shorter names first, then lexicographic. It is NOT the order
#     the record is authored in on the node. The completeness gate
#     (custos/internal/gate, `TestDescriptorsCoverManifest`) compares this list against
#     MANIFEST.cddl entry-for-entry and fails on a missing field, an extra field, a
#     wrong order, a missing path, or an orphan record. Do not hand-sort: run the gate.
#
#   * `status: live` means something in this tree builds the record today.
#     `status: specified` means the shape is catalogued and nothing produces it —
#     an agent asking that path a question will get silence, and should be told why
#     rather than left to infer a dead node.
#
# Vocabulary (both gated):
#   kind:  identity | config | instantaneous | cumulative | high-water | event
#   unit:  bytes | ms | us | seconds | count | symbol | text | opaque | bool | blobref | any
#
# `validity` is the D4 reading rule and is present only where there is a real trap;
# `segment` names what an aggregate must group by first; `refs` point at the record of
# the finding. Absence of `validity` is a claim: the field means what it says.

version: 1

records:

  # ===================================================================
  # sys/** — the node's own gauges and faults
  # ===================================================================

  metrics:
    record: Metrics
    paths: [sys/metrics]
    status: live
    summary: >
      The GC arena and the ISR pulse seam, published as a cell on every check-in.
      NOT the C heap — that is sys/cheap, and a leak ran for a week against this
      record because it cannot see the other allocator.
    fields:
      - key: lb
        name: liveBytes
        unit: bytes
        kind: instantaneous
        meaning: bytes of the GC arena held by live objects at the moment of the sample
        validity: >
          Sawtooths with every GC cycle, so two samples yield any trend you like.
          The readable floor is min(lb) per gcc bucket — a post-sweep proxy — never
          a raw series.
        segment: [obs/build, boot, gcc]
        refs: [rete#153, "review/tests/CLAIMS.md"]
      - key: gcc
        name: gcCycles
        unit: count
        kind: cumulative
        meaning: garbage collections run since boot
        validity: >
          The segmentation unit for every heap gauge here: bucket by gcc, not by
          wall clock. A node bridging at 2 s accumulates cycles ~14x faster than one
          at 30 s, so 45 minutes on the fast node is a longer test than ten hours on
          the slow one. Discard the first ~5 cycles of a boot — they run on an arena
          that has never been swept.
        segment: [obs/build, boot]
        refs: [rete#153]
      - key: hhw
        name: heapHighWater
        unit: bytes
        kind: high-water
        meaning: the largest liveBytes seen since boot
        validity: >
          Monotone by construction. A flat hhw is evidence that no NEW record was set,
          never evidence that the current window is flat.
        segment: [obs/build, boot]
      - key: hnl
        name: handlesLive
        unit: count
        kind: instantaneous
        meaning: handles open at the moment of the sample
      - key: hsz
        name: heapSize
        unit: bytes
        kind: config
        meaning: total size of the GC arena
        validity: >
          Compile-time (OEVM_HEAP_SIZE), so it cannot vary within a build — 128 KB on
          the C6. A change in this number means a different image, which makes it a
          segmentation key rather than a series.
        segment: [obs/build]
      - key: lfb
        name: largestFreeBlock
        unit: bytes
        kind: instantaneous
        meaning: largest contiguous free block in the GC arena
        validity: >
          INVALID as a point sample. The GC fires only on arena exhaustion, so the
          sample before a collection reports what the FAILING allocation left behind.
          Use max(lfb) per gcc bucket; discard the first ~5 cycles of a boot; do not
          fit a trend to a window shorter than ~5 h — a run flat over 9.95 h yields
          "falling 7.1 sigma" and "rising 8.5 sigma" in adjacent 1.5 h slices.
          min(lfb) is not a gauge at all: it is the last-failed-request size.
        segment: [obs/build, boot, gcc]
        refs: [rete#153, "review/tests/CLAIMS.md"]
      - key: ovr
        name: overruns
        unit: count
        kind: cumulative
        meaning: entries dropped since boot under G2 overflow pressure (the drop-first policy firing)
        validity: >
          Counts the policy working, not a fault — tel/** is deliberately the first
          thing shed to save a node. sys/overrun carries the per-path breakdown, but
          nothing produces that record today.
        segment: [boot]
      - key: pco
        name: pulseCoalesced
        unit: count
        kind: cumulative
        meaning: ISR pulse events merged into one wakeup by the coalescer since boot
        validity: >
          Coalescing is not loss. A busy seam with pco climbing while pdr and pst stay
          0 is healthy; that pco is bounded by nothing is what rete#240 tracks.
        segment: [boot]
        refs: [rete#151, rete#240]
      - key: pdr
        name: pulseDrops
        unit: count
        kind: cumulative
        meaning: pulse events shed since boot because the ISR mailbox was full
        validity: >
          Any non-zero value is a lost wakeup. It does not count every loss: a
          NULL-payload path sheds uncounted, and the stale-handle guard's discards
          are counted at pst instead — so pdr 0 is not "nothing was lost".
        segment: [boot]
        refs: [rete#151]
      - key: pst
        name: pulseStale
        unit: count
        kind: cumulative
        meaning: events discarded since boot by the stale-handle guard
        validity: >
          pdr reads 0 through this loss, so pst is the only witness that the handle
          path is destroying wakeups. Uncounted before rete#214, which is how the
          record could report a healthy seam that was shedding events. A non-zero
          value names the HANDLE path, never the mailbox.
        segment: [boot]
        refs: [rete#214, tuvm#13]
      - key: qhw
        name: queueHighWater
        unit: count
        kind: high-water
        meaning: deepest the event queue has been since boot
        segment: [boot]
      - key: hnhw
        name: handlesHighWater
        unit: count
        kind: high-water
        meaning: most handles open at once since boot
        segment: [boot]

  cheap:
    record: CHeap
    paths: [sys/cheap]
    status: live
    summary: >
      The C heap — the allocator the GC arena knows nothing about. A separate record
      rather than five more Metrics fields, on the LatencySpan precedent.
    fields:
      - key: ob
        name: outBytes
        unit: bytes
        kind: instantaneous
        meaning: C-heap bytes allocated and not yet freed
        validity: >
          The live gauge for a C-side leak, and the one to read instead of alc - fre.
          rete#190's leak ran a week against sys/metrics, which cannot see this heap.
        segment: [obs/build, boot]
        refs: [rete#190]
      - key: alc
        name: allocs
        unit: count
        kind: cumulative
        meaning: oevm_malloc calls since boot
        validity: >
          alc - fre is INFLATED, not a live object count: every oevm_realloc bumps
          allocs and never frees. The subtraction is wrong in a way no view can fix,
          which is why it gets a rule here and not a column. Read ob.
        segment: [boot]
        refs: [rete#190]
      - key: fal
        name: fails
        unit: count
        kind: cumulative
        meaning: allocation failures since boot
        validity: >
          Read ohw against the target's C-heap ceiling (~200 KB on the C6) before
          concluding exhaustion — a failure at low ob is fragmentation, which is the
          usual cause and has a different fix.
        segment: [obs/build, boot]
      - key: fre
        name: frees
        unit: count
        kind: cumulative
        meaning: oevm_free calls since boot
        validity: see alc — realloc makes the alc/fre difference an over-count, not a leak measure.
        segment: [boot]
      - key: ohw
        name: outHigh
        unit: bytes
        kind: high-water
        meaning: peak outstanding C-heap bytes since boot
        segment: [obs/build, boot]

  latency-span:
    record: LatencySpan
    paths: [sys/latency, "diag/spans/<span>"]
    status: live
    summary: >
      One record PER SPAN, so instrumenting another job adds a record and never a
      field. Eight slots are not the app's to choose: httpQueue and egress are
      C-owned, and PortaBridge registers pullSend, pullWait, applyIn, pushBuild,
      pushSend and pushWait at construction.
    fields:
      - key: n
        name: samples
        unit: count
        kind: cumulative
        meaning: samples recorded in this capture window
        validity: >
          Window-scoped, not since-boot: a capture resets both the C sample table and
          the nsl-side failure counts. Below 200 samples no percentile is reported at
          all, because a p95 over 20 samples is simply the 19th value.
        segment: [obs/build, boot, span]
      - key: b0
        name: bucket_lt100us
        unit: count
        kind: cumulative
        meaning: samples under 100 us
        validity: >
          A decade bucket, and the mass inside one bunches at an end — a percentile
          derived from these answers WHICH DECADE, never a number. There is
          deliberately no interpolation.
        segment: [obs/build, boot, span]
      - key: b1
        name: bucket_lt1ms
        unit: count
        kind: cumulative
        meaning: samples from 100 us to under 1 ms
        segment: [obs/build, boot, span]
      - key: b2
        name: bucket_lt10ms
        unit: count
        kind: cumulative
        meaning: samples from 1 ms to under 10 ms
        segment: [obs/build, boot, span]
      - key: b3
        name: bucket_lt100ms
        unit: count
        kind: cumulative
        meaning: samples from 10 ms to under 100 ms
        segment: [obs/build, boot, span]
      - key: b4
        name: bucket_lt1s
        unit: count
        kind: cumulative
        meaning: samples from 100 ms to under 1 s
        segment: [obs/build, boot, span]
      - key: b5
        name: bucket_ge1s
        unit: count
        kind: cumulative
        meaning: samples of 1 s and over
        segment: [obs/build, boot, span]
      - key: span
        name: span
        unit: symbol
        kind: identity
        meaning: the slot's name, which is also the last path segment under diag/spans/
        validity: >
          The slot INDEX is not stable across images and never rides the wire; this
          name is the join key. A node publishes every registered slot each window,
          including one that took no samples — skipping empties would leave last
          window's numbers standing under this window's label.
      - key: fails
        name: fails
        unit: count
        kind: cumulative
        meaning: jobs that failed and therefore produced NO sample
        validity: >
          Counted in nsl because a failure is an app-level concept the C seam cannot
          see. Without it a failing job silently IMPROVES the percentiles, so a span
          with fails climbing and a healthy p95 is the failure signature, not a
          contradiction.
        segment: [obs/build, boot, span]
      - key: maxUs
        name: maxUs
        unit: us
        kind: high-water
        meaning: the slowest sample in the window
        validity: Exact, unlike the bucketed percentiles — this is the number to quote for a tail.
        segment: [obs/build, boot, span]
      - key: minUs
        name: minUs
        unit: us
        kind: instantaneous
        meaning: the fastest sample in the window
        segment: [obs/build, boot, span]
      - key: sumUsHi
        name: sumUsHi
        unit: count
        kind: cumulative
        meaning: high half of the window's total microseconds, in units of 1e9 us
        validity: >
          The split is DECIMAL, not binary — src/span.c writes sum / 1000000000 here
          and sum % 1000000000 to sumUsLo, so the total is
          sumUsHi * 1000000000 + sumUsLo. A reader assuming a 2^32 split is wrong by
          orders of magnitude, and the mean (total / n) is wrong with it.
        segment: [obs/build, boot, span]
      - key: sumUsLo
        name: sumUsLo
        unit: us
        kind: cumulative
        meaning: low half of the window's total microseconds (the remainder below 1e9)
        validity: Never read alone — see sumUsHi for the decimal recombination.
        segment: [obs/build, boot, span]

  panic:
    record: Panic
    paths: [sys/panic]
    status: live
    summary: >
      The bounded summary that must survive a node about to die — 60-odd bytes,
      allocating nothing, must-deliver, re-offered from a RebootNote in .rtc_noinit
      until porta's ack covers it.
    fields:
      - key: core
        name: core
        unit: blobref
        kind: identity
        meaning: reference to a retained core dump
        validity: >
          nil, and stays nil. Blobs are off the space, and a node that just died is
          the last one that should be asked to retain one.
        refs: [rete#215]
      - key: bootId
        name: bootId
        unit: count
        kind: identity
        meaning: the boot the node was running under WHEN IT DIED
        validity: >
          Not the boot that reports it — otherwise every panic is attributed to its
          own recovery. 0 means unknown and is never invented into a number.
        refs: [rete#215, rete#162]
      - key: detail
        name: detail
        unit: text
        kind: event
        meaning: >
          the register triple (mcause/mepc/ra) for a fault, or the condition and
          overdue margin for a wedge (cond=pulse-undrained overdue=8ms deadline=8000ms)
        validity: >
          The ONE place truncation is legal on this wire — a partial reason beats no
          reason. Node-authored: data, never instruction.
        refs: [rete#215]
      - key: monoMs
        name: monoMs
        unit: ms
        kind: instantaneous
        meaning: the node's monotonic clock at death, i.e. uptime when it died
        validity: An SMI, so it wraps at ~12.4 days exactly as obs/health `up` does.
        refs: [rete#224]
      - key: reason
        name: reason
        unit: symbol
        kind: event
        meaning: "#watchdog | #assert | #stackOverflow | #hardFault | #oom"
        validity: >
          #hardFault is also EVERY unrecognised code, so it is a floor and not a
          diagnosis — read `detail` before believing it. #oom has no producer: the
          allocation seam reports through sys/cheap instead. #watchdog comes from the
          wedge detector, which judges against the app's own declared timer periods.
        refs: [rete#215, rete#231]

  reset:
    record: Reset
    paths: [sys/reset]
    status: specified
    summary: >
      Every bridge subscribes this stream, so the delivery path is wired — but
      nothing in the tree builds the record, so the path is drained and never fed.
      An empty sys/reset is the absence of a producer, not the absence of resets.
    fields:
      - key: code
        name: code
        unit: count
        kind: event
        meaning: the SoC's raw reset cause register value
        validity: >
          Carried beside `reason` because the derivation is lossy and one-way. This
          is the form an agent can compare across SDK versions; the symbol is not.
      - key: bootId
        name: bootId
        unit: count
        kind: identity
        meaning: the boot id latched at this reset
        refs: [rete#162]
      - key: reason
        name: reason
        unit: symbol
        kind: event
        meaning: the symbol derived from `code`
        validity: Lossy — two distinct codes can land on one symbol. Compare `code` when it matters.

  overrun:
    record: Overrun
    paths: [sys/overrun]
    status: specified
    summary: >
      G2's per-path drop counter. Nothing builds it today; the fleet-wide total is
      visible at sys/metrics `ovr`, without the breakdown this record would add.
    fields:
      - key: path
        name: path
        unit: text
        kind: identity
        meaning: the path whose entries were dropped
      - key: dropped
        name: dropped
        unit: count
        kind: cumulative
        meaning: entries dropped at that path
        segment: [boot]

  # ===================================================================
  # obs/** — what the node observes
  # ===================================================================

  health:
    record: Health
    paths: [obs/health]
    status: live
    summary: >
      Liveness and delivery ONLY — the VM internals live at sys/metrics. Three
      mutually inconsistent definitions of this record (3 fields, 7, and 8 on the
      wire) is what two overlapping health records cost.
    fields:
      - key: up
        name: monoMs
        unit: ms
        kind: instantaneous
        meaning: the node's monotonic clock at publish, i.e. uptime
        validity: >
          An SMI, so it WRAPS at ~12.4 days. A decrease is a wrap or a reboot and this
          field cannot tell you which — read `bid` beside it.
        segment: [boot]
        refs: [rete#224]
      - key: bid
        name: bootId
        unit: count
        kind: identity
        meaning: the persisted per-boot counter (NVS oevm/bootid), latched at boot
        validity: >
          0 means the node has NO restart detection by design, and is never invented
          into a number. A change here is the only reliable reboot signal — and this
          is the only place a boot id reaches a path. It carried the literal 1 on
          every node for three rungs, so data before 2026-08-15 cannot be segmented
          by it.
        refs: [rete#162, rete#211]
      - key: pto
        name: pollTimeouts
        unit: count
        kind: cumulative
        meaning: exchanges since boot that got NO reply
        validity: >
          Counts SILENCE only. A node porta is refusing gets a reply to every
          exchange, so pto reads 0 all the way to its death — this field alone cannot
          distinguish a healthy node from a rejected one. Read `ref`.
        segment: [boot]
        refs: [rete#199]
      - key: ref
        name: refused
        unit: count
        kind: cumulative
        meaning: exchanges since boot that porta answered with #err
        validity: >
          Non-zero means this node's data is not reaching the gateway AT ALL, whatever
          pto says. This is the discriminator the staleness view splits on:
          never-checked-in vs refused vs wedged.
        segment: [boot]
        refs: [rete#199, rete#232]
      - key: rej
        name: rejected
        unit: count
        kind: cumulative
        meaning: >
          inbound entries the node counted and dropped since boot — malformed,
          out-of-authority, or kind-mismatched
        validity: >
          The loss is PERMANENT. The cursor advanced past the entry and porta's replay
          guard will not re-serve it, so a rising rej is a silent divergence between
          what the operator wrote and what the node runs — not a retryable error.
        segment: [boot]
        refs: [rete#232, rete#262]
      - key: sdr
        name: streamDropped
        unit: count
        kind: cumulative
        meaning: outbound stream rows evicted from the bounded pending queue since boot
        validity: >
          Information lost on the way OUT — the number that says this node's own
          observability is lying. The queue is bounded at 64 rows because an unbounded
          one OOM-panicked a C6 at ~96 s of unacked pushing.
        segment: [boot]
      - key: wak
        name: wakes
        unit: count
        kind: cumulative
        meaning: bridge ticks since boot
        validity: Carries the raw tick count until goal/mode gives it a stricter meaning.
        segment: [boot]

  build:
    record: Build
    paths: [obs/build]
    status: live
    summary: >
      Build provenance — the segmentation key for everything else. A node id is the
      board's factory link address since rete#118, but a space still carries many builds, and aggregating
      across them is how a number goes silently wrong.
    fields:
      - key: man
        name: manifestPin
        unit: opaque
        kind: identity
        meaning: first 8 bytes of the SHA-256 of the MANIFEST.cddl this image was compiled against
        validity: >
          Identifies, never authenticates. ABSENT when the build carries no pin (host
          builds, pre-manifest images) — absence means the node cannot say, and is not
          a default. Node pin vs archive pin vs porta's served hash disagreeing
          localizes a fault to image, archive, or deployment.
        refs: [rete#243]
      - key: sdk
        name: sdk
        unit: text
        kind: identity
        meaning: the Zephyr/SDK version string as the build reports it
        validity: Omitted by every shipping builder today — absence means the node cannot say.
      - key: chip
        name: chip
        unit: symbol
        kind: identity
        meaning: "the SoC family: #esp32c6, #esp32s2, #nrf52840, #host"
      - key: board
        name: board
        unit: text
        kind: identity
        meaning: >
          the bench board the image was built for (the collector env file name); the
          node asserts it on every boot
        validity: >
          Optional: absent when the build was not told a board name. A name, not a
          credential.
        refs: [rete#118]
      - key: build
        name: build
        unit: text
        kind: identity
        meaning: >
          the build actually running — git describe --always --dirty plus a build
          timestamp on Zephyr, the literal "host" on host
        validity: >
          Deliberately ONE opaque string. Match it WHOLE, never piecewise: a per-method
          profile's offsets are only meaningful against the .oimg.map.json sidecar
          of this exact build, and a piecewise match makes a mismatched sidecar
          indistinguishable from a quiet program. This is the segment key of record.
        refs: [rete#74]
      - key: image
        name: image
        unit: opaque
        kind: identity
        meaning: truncated 8-byte hash of the running .oimg
        validity: >
          Identifies against a known set; does not authenticate. Omitted today —
          absence means the node cannot say.

  liveness:
    record: Liveness
    paths: [goal/liveness, obs/liveness]
    status: live
    summary: >
      The node's own declaration of how often it will speak and how many consecutive
      misses it tolerates, which replaced porta's inference of both terms (rete#231)
      and then the node's own published budget (rete#273 D2). The budget porta judges
      against is DERIVED, telCad x misses, and never rides the wire. Written once per
      boot, and again only when the adopted pair moves.
    fields:
      - key: misses
        name: miss allowance
        unit: count
        kind: config
        meaning: consecutive missed check-ins the node tolerates before its silence means anything
        validity: >
          The node's own allowance for ordinary mesh loss — c6-bell misses roughly
          half its 30 s check-ins, and the node is the only party that knows its rate.
          8 at every period is the fleet default (D2.3): the false-trip rate is about
          p^misses and the period cancels. Clamped so telCad x misses <= 24 h and
          PUBLISHED, never rejected, so an app asking for a week shows up as a
          goal/obs divergence rather than a silent refusal. porta declines to judge a
          product below its 30 s sweep tick and says so as #unknown (D2.1).
        refs: [rete#273, rete#231]
      - key: telCad
        name: telemetry cadence
        unit: ms
        kind: config
        meaning: how often the node intends to check in
        validity: >
          NOT the staleness threshold, and NOT the app-liveness cadence: that one
          (appCad, rete#273 D1) is judged on the node by the observer and never crosses
          the wire. Judging a node against telCad alone calls a healthy node silent
          constantly; the budget is telCad x misses.
        refs: [rete#273, rete#231, rete#240]

  app-obs:
    record: AppObs
    paths: ["obs/apps/<name>"]
    status: live
    summary: >
      What the node can say about the app it is running, written once per boot. It
      is what goal/apps/<name> is diffed against, so the four fields stay pinned:
      a field the node learns to answer later is then a write, not a schema edit.
    fields:
      - key: image
        name: image
        unit: blobref
        kind: identity
        meaning: BlobRef whose hash is the image actually executing
        validity: >
          The BlobRef's own size and alg are omitted — they are porta's facts about a
          blob porta stored, not something the node observes.
        refs: [rete#25]
      - key: runlevel
        name: runlevel
        unit: count
        kind: config
        meaning: the runlevel the app is at
        validity: Omitted today — no node holds a runlevel (one image, one world). Absence means the node cannot say.
      - key: triggers
        name: triggers
        unit: any
        kind: config
        meaning: the list of trigger symbols the app is armed on
        validity: >
          Omitted today, same reason as runlevel. Typed `any` in MANIFEST because
          zcbor 0.9.1 cannot express a quantified tagged list element; the wire truth
          is a list of symbols.
      - key: lifecycle
        name: lifecycle
        unit: symbol
        kind: identity
        meaning: what the app is doing — the node writes #running
        validity: >
          There is no tombstone anywhere on this wire: a stopped app is this field
          written to a stopped value, never a deletion.

  # ===================================================================
  # goal/** — what porta wants
  # ===================================================================

  app:
    record: App
    paths: ["goal/apps/<name>"]
    status: live
    summary: >
      ~80 bytes whether the app is 4 KB or 400 KB, because the image is a BlobRef —
      this record is where the size law earns its keep. This slice reads and writes
      exactly apps/main.
    fields:
      - key: sig
        name: sig
        unit: opaque
        kind: identity
        meaning: porta's ed25519 signature over the image's SHA-256
        validity: >
          REQUIRED — the bridge answers nil for an App without it, so nothing is
          staged rather than something staged with its provenance quietly missing.
          Absent is not "unsigned, carry on". Verified by the RUNNER, outside the
          image it judges; the C staging seam checks only the content hash, which is
          transfer integrity and not authentication.
        refs: [rete#25]
      - key: image
        name: image
        unit: blobref
        kind: identity
        meaning: BlobRef for the image porta wants running
      - key: runlevel
        name: runlevel
        unit: count
        kind: config
        meaning: the runlevel to bring the app to
        validity: Optional and unused — no node holds a runlevel today.
      - key: triggers
        name: triggers
        unit: any
        kind: config
        meaning: trigger symbols to arm the app on
        validity: Optional and unused today. Typed `any` for the same zcbor limit as AppObs.
      - key: arguments
        name: arguments
        unit: any
        kind: config
        meaning: a map of symbol to scalar, passed to the app
      - key: lifecycle
        name: lifecycle
        unit: symbol
        kind: config
        meaning: the state porta wants the app in
        validity: Uninstall is this field written to a stopped value. Genuine removal is an action on a do/ stream.

  mode:
    record: Mode
    paths: [goal/mode, obs/mode]
    status: specified
    summary: >
      The duty-cycle policy. Nothing in this tree writes, reads or honours it — no
      producer and no consumer — so every field below is a catalogue entry, not a
      behaviour. Atomic by construction: one record at one path, so v1's
      accept-the-whole-thing rule dissolves.
    fields:
      - key: mode
        name: mode
        unit: symbol
        kind: config
        meaning: the duty mode the node should run
      - key: maxAwakeS
        name: maxAwakeS
        unit: seconds
        kind: config
        meaning: ceiling on one awake stretch
      - key: minAwakeS
        name: minAwakeS
        unit: seconds
        kind: config
        meaning: floor on one awake stretch
      - key: loopSleepS
        name: loopSleepS
        unit: seconds
        kind: config
        meaning: sleep between reactor loops while awake
      - key: maxAsleepS
        name: maxAsleepS
        unit: seconds
        kind: config
        meaning: ceiling on one sleep stretch

  debug:
    record: Debug
    paths: ["goal/debug/<app>"]
    status: live
    summary: >
      The WHOLE breakpoint set for one program: porta replays a cell to a fresh boot,
      so this is what a deep-sleeping node re-arms from on every wake (a dbg/req row
      is not replayed, rete#262). The session itself stays on dbg/req + dbg/resp.
      An empty set is the detach; there is no action field and no tombstone.
    fields:
      - key: sha
        name: sha
        unit: bytes
        kind: identity
        meaning: the image hash the offsets belong to (obs/apps/<app>.image.hash)
        validity: >
          A node running another image arms nothing and answers `dbg:error sha` on
          dbg/resp. A node that knows no hash (a bare host run) cannot check and arms.
        refs: [rete#375]
      - key: breaks
        name: breaks
        unit: any
        kind: config
        meaning: "[[blob, off] …]: each breakpoint's method blob offset and pc, as dbg:break names them"
        refs: [rete#375]

  debug-obs:
    record: DebugObs
    paths: [obs/debug]
    status: live
    summary: >
      Held, and where. Written by the node at every stop (held true, the frame's
      blob offset and pc) and on continue (held false), so porta and the monitor
      show a held node when no debugger is attached. Absent until the first stop.
    fields:
      - key: off
        name: off
        unit: count
        kind: instantaneous
        meaning: pc within the method; 0 when not held
        refs: [rete#375]
      - key: blob
        name: blob
        unit: count
        kind: instantaneous
        meaning: the method's blob offset; 0 when not held or in a Path A image (no blob)
        refs: [rete#375]
      - key: held
        name: held
        unit: bool
        kind: instantaneous
        meaning: true while the program is stopped in the debugger's command loop
        refs: [rete#375]

  console:
    record: Console
    paths: [goal/console]
    status: live
    summary: >
      Where the node tees its console, one UDP datagram per line (rete#415). custos
      writes it with its own address and a port it bound, so the rows of a profile
      window, which never ride the space, reach the custos that asked. An empty addr
      turns the tee off. A cell, so a cold-booting node re-tees at its first check-in.
    fields:
      - key: addr
        name: addr
        unit: text
        kind: config
        meaning: a literal IPv6 address (the mesh has no name service); "" = no tee
        validity: >
          The cell says where the node was told to send, not that anyone listens: a
          custos that has stopped leaves its address here, and the node keeps sending
          to a port nobody binds. A UDP datagram is one line, so lines can be lost
          without a trace on either end; a profile dump's header counts its rows.
        refs: [rete#415]
      - key: port
        name: port
        unit: count
        kind: config
        meaning: the UDP port at addr
        refs: [rete#415]

  profile:
    record: Profile
    paths: [goal/profile]
    status: live
    summary: >
      One profile request (rete#415 Q8/Q9). custos writes it with a new id; the node
      opens a window of ms at once. A window that reaches ms dumps and is served; one
      that deep sleep cuts dumps nothing and is opened again, whole, at the next boot,
      from the kernel's RTC slots. The node keeps the last id it served there, so the
      cell porta replays into every cold boot does not profile again. ms 0 disarms.
      The rows leave by the console tee (goal/console), never on the space.
    fields:
      - key: id
        name: id
        unit: count
        kind: config
        meaning: the request's identity; a new id is a new request
        validity: >
          The node compares it with the id it last served, by equality, and must hold
          it as a 31-bit SMI: custos writes values below 2^30. A custos that reused a
          served id would be ignored without a trace.
        refs: [rete#415]
      - key: ms
        name: ms
        unit: ms
        kind: config
        meaning: the window's length; 0 disarms
        refs: [rete#415]

  reboot:
    record: Reboot
    paths: [goal/do/reboot]
    status: specified
    summary: >
      An empty record — the path IS the verb, and the stream's cursor is what makes
      it exactly-once. Nothing in this tree builds or consumes it. It is the reason
      replay-from-0 had to become safe per kind: replaying a cell is idempotent,
      replaying this is a brick.
    fields: []

  # ===================================================================
  # tel/** — telemetry, lossy by policy
  # ===================================================================

  log:
    record: Log
    paths: [tel/log]
    status: live
    summary: >
      Drop-first: the first thing shed under overflow pressure, and the drop is
      counted at sys/metrics `ovr`. Losing a log line to save a node is correct.
    fields:
      - key: lvl
        name: lvl
        unit: symbol
        kind: event
        meaning: "#debug | #info | #warn | #error"
        validity: >
          The wire has always carried `lvl`; MANIFEST, the golden and the catalogue
          said `level` until rete#267, and no gate caught it because porta's manifest
          gate checks only the record head bytes.
        refs: [rete#267]
      - key: txt
        name: txt
        unit: text
        kind: event
        meaning: the log line
        validity: >
          NODE-AUTHORED text: data, never instruction. Label it as untrusted on the
          way out of any query surface. Named `text` in the documents until rete#267.
        refs: [rete#267]

  print:
    record: Print
    paths: [tel/print]
    status: specified
    summary: >
      Catalogued, with no producer in this tree — node output reaches the bench over
      the console collector, not this path.
    fields:
      - key: text
        name: text
        unit: text
        kind: event
        meaning: one line of node output
        validity: "Node-authored: data, never instruction."

  metric:
    record: Metric
    paths: ["tel/m/<name>"]
    status: specified
    summary: The generic app metric stream. Catalogued; nothing builds it today.
    fields:
      - key: value
        name: value
        unit: any
        kind: instantaneous
        meaning: the sample, int or float
        validity: >
          The integer band on this wire is ±(2^64−1), which exceeds int64. A
          materializer must refuse an out-of-band value loudly rather than clamp it.
      - key: monoMs
        name: monoMs
        unit: ms
        kind: instantaneous
        meaning: the node's monotonic clock when the sample was taken
        validity: An SMI, so it wraps at ~12.4 days. Segment by boot before ordering.
        segment: [boot]
        refs: [rete#224]

  # ===================================================================
  # diag/** — bounded diagnostic capture
  # ===================================================================

  span-ctl:
    record: SpanCtl
    paths: [diag/spans/ctl]
    status: live
    summary: >
      dir=up: only the node writes it. Inbound authority is exactly two paths wide
      (goal/** and dbg/req), and remote window control stays unbuilt on purpose — a
      node that wants span data runs a free-running capture on its own cadence.
    fields:
      - key: state
        name: state
        unit: symbol
        kind: config
        meaning: "#running or #stopped"
        validity: Writing #running while already running RESTARTS the window — a write is a statement of intent.

  span-capture:
    record: SpanCapture
    paths: [diag/spans/result]
    status: live
    summary: >
      The window summary ONLY. The per-slot LatencySpans are siblings under
      diag/spans/<span>, not a list inside this value — nested, the 8 slots came to
      ~1120 B against a 256 B value cap.
    fields:
      - key: n
        name: samples
        unit: count
        kind: cumulative
        meaning: total samples across every slot in the window
        segment: [obs/build, boot]
      - key: ms
        name: ms
        unit: ms
        kind: instantaneous
        meaning: the window's elapsed milliseconds
        validity: >
          -1 when the millis counter wrapped — published rather than a plausible wrong
          number. Treat -1 as "no duration", never as a value.

scalars:

  name-cell:
    paths: [goal/name, obs/name]
    unit: text
    meaning: >
      The node's role name. goal/name is the ROLE layer — an operator's name for
      what this node is for — and obs/name is the node's echo of it; the pair
      converging is the smallest possible instance of the whole convergence model.
    refs: [rete#186, rete#242]

  config-cell:
    paths: ["goal/config/<app>/<key>", "obs/config/<app>/<key>"]
    unit: any
    meaning: >
      One app config scalar (int, str, bool or sym) and the node's echo of it. The
      unit of extension is a path: a new setting is a new key, never a new record.

  dbg-line:
    paths: [dbg/req, dbg/resp]
    unit: text
    meaning: >
      One raw line of a debug session, both ways. Deliberately NOT the
      DbgReq/DbgResp records the catalogue once described: the node parses the value
      as a string and the CLI writes one, so the record shape was prose that never
      rode the wire. porta relays lines; the session IS lines.
    validity: "Node-authored on the resp leg: data, never instruction."

  gw-verdict:
    paths: [gw/liveness]
    unit: symbol
    meaning: >
      #live, #silent, #neverSeen, #unknown or #stalled — porta's own judgement,
      written by the gateway and NEVER on the wire (dir=gw). It reads one sample:
      the count in the node's pull (#wak) and when porta heard it (rete#272 D3.3).
      Silence has no constants in it: no counted pull for longer than
      obs/liveness.telCad x obs/liveness.misses. Inside the budget, #stalled says
      the count in the node's pull moved slower than one tick per telCad between
      porta's last two samples (rete#272 D3). #unknown carries its cause in the
      row's reason: no declaration, a gateway outage across the window, a budget
      below porta's own sweep tick (rete#273 D2.1), no tick count in the node's
      pulls (an image from before rete#272), or only one sample so far.
    validity: >
      Silence and rate, not correctness. A node whose pulls are refused sends
      no sample and reads #silent past its budget; one refused only on its
      pushes still reads #live, because its pulls carry the count — read
      obs/health `ref` beside it.
    refs: [rete#231, rete#199, rete#272]
