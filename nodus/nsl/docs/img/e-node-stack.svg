<svg xmlns="http://www.w3.org/2000/svg" width="760" height="770" viewBox="0 0 760 770" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="770" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="24" y="34" font-size="21" font-weight="bold" fill="#111">One node: nRF52840, 256 KB RAM, 1 MB flash</text>
<text x="24" y="56" font-size="13" fill="#555">Blue is nsl and the VM, grey is Zephyr's, green is the liveness observer. RAM sizes shown per layer.</text>
<rect x="24" y="74" width="476" height="232" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
<text x="38" y="98" font-size="15" font-weight="bold" fill="#111">VM thread (a Zephyr thread)</text>
<text x="38" y="117" font-size="12.5" fill="#333">oevm: a C interpreter, about 42 KB of flash</text>
<rect x="38" y="132" width="196" height="160" rx="8" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="50" y="156" font-size="15" font-weight="bold" fill="#111">nsl program</text>
<text x="50" y="178" font-size="12.5" fill="#333">the reactor and its jobs</text>
<text x="50" y="198" font-size="12.5" fill="#333">image lives in flash, read-only,</text>
<text x="50" y="215" font-size="12.5" fill="#333">executed in place (see below)</text>
<rect x="250" y="132" width="236" height="160" rx="8" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="262" y="156" font-size="15" font-weight="bold" fill="#111">VM arena: 112 KB RAM</text>
<text x="262" y="178" font-size="12.5" fill="#333">objects</text>
<text x="262" y="198" font-size="12.5" fill="#333">its own 16 KB stack</text>
<text x="262" y="218" font-size="12.5" fill="#333">floats</text>
<rect x="520" y="74" width="216" height="232" rx="8" fill="#ecfdf5" stroke="#34a853" stroke-width="1.5"/>
<text x="534" y="98" font-size="15" font-weight="bold" fill="#111">Liveness observer</text>
<text x="534" y="117" font-size="12.5" fill="#333">a second Zephyr thread, in C</text>
<text x="534" y="150" font-size="12.5" fill="#333">watches the reactor's</text>
<text x="534" y="167" font-size="12.5" fill="#333">progress</text>
<polyline points="520,190 500,190" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<polyline points="262,306 262,330" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="332" width="712" height="58" rx="8" fill="#fff4dc" stroke="#d4a72c" stroke-width="1.5"/>
<text x="38" y="356" font-size="15" font-weight="bold" fill="#111">Primitives: 160, a closed list</text>
<text x="38" y="376" font-size="12.5" fill="#333">the only path from nsl code down to the Zephyr drivers</text>
<polyline points="200,390 200,420" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="422" width="344" height="300" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="38" y="444" font-size="15" font-weight="bold" fill="#111">RAM, 256 KB (Zephyr side)</text>
<rect x="38" y="454" width="316" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="50" y="478" font-size="12.5" fill="#111">Zephyr system heap</text><text x="342" y="478" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">32 KB</text>
<rect x="38" y="496" width="316" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="50" y="520" font-size="12.5" fill="#111">Net buffers</text><text x="342" y="520" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">14 KB</text>
<rect x="38" y="538" width="316" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="50" y="562" font-size="12.5" fill="#111">mbedTLS</text><text x="342" y="562" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">10 KB</text>
<rect x="38" y="580" width="316" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="50" y="604" font-size="12.5" fill="#111">OpenThread + 802.15.4 driver</text><text x="342" y="604" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">25 KB</text>
<rect x="38" y="622" width="316" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="50" y="646" font-size="12.5" fill="#111">Zephyr kernel + drivers + USB</text><text x="342" y="646" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">57 KB</text>
<rect x="38" y="666" width="316" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="50" y="690" font-size="12.5" fill="#333">spare</text><text x="342" y="690" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">4 KB</text>
<rect x="392" y="422" width="344" height="300" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="406" y="444" font-size="15" font-weight="bold" fill="#111">Flash, 1 MB: two partitions</text>
<rect x="406" y="458" width="316" height="100" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="418" y="482" font-size="15" font-weight="bold" fill="#111">Firmware</text>
<text x="418" y="504" font-size="12.5" fill="#333">Zephyr + the VM (oevm)</text>
<text x="418" y="522" font-size="12.5" fill="#333">changed only by reflashing</text>
<rect x="406" y="574" width="316" height="132" rx="6" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="418" y="598" font-size="15" font-weight="bold" fill="#111">Program image (nsl)</text>
<text x="418" y="620" font-size="12.5" fill="#333">read-only, executed in place</text>
<text x="418" y="638" font-size="12.5" fill="#333">replaced by a "load",</text>
<text x="418" y="656" font-size="12.5" fill="#333">without reflashing</text>
<rect x="24" y="732" width="712" height="26" rx="6" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>
<text x="380" y="750" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">MCU and radio: nRF52840</text>
</svg>
