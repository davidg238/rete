<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="632" viewBox="0 0 1060 632" font-family="Helvetica, Arial, sans-serif">
<rect width="1060" height="632" fill="#ffffff"/>
<text x="20" y="34" font-size="20" font-weight="bold" fill="#1a1a1a">What drives each nsl divergence from Newspeak</text>
<text x="20" y="58" font-size="13" fill="#555">Numbers are rows of NEWSPEAK_DIALECT.md. Filled = the primary reason the record gives; ring = a secondary one.</text>
<text x="464" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RAM / flash</text>
<text x="464" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">budget</text>
<text x="553" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">JIT-less</text>
<text x="553" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">interpreter</text>
<text x="641" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Capability</text>
<text x="641" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">security</text>
<text x="730" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Read-only</text>
<text x="730" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">image</text>
<text x="819" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Flat engine,</text>
<text x="819" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">run to completion</text>
<text x="907" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">One wire</text>
<text x="907" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">meaning</text>
<text x="996" y="86" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Simplicity</text>
<text x="996" y="102" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">(YAGNI)</text>
<rect x="10" y="120" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="141" font-size="13" fill="#1a1a1a">Static classes, no mixins, hand accessors</text>
<text x="400" y="141" font-size="12" text-anchor="end" fill="#666">1, 2, 6</text>
<circle cx="553" cy="137" r="8" fill="#2f5d9e"/>
<circle cx="996" cy="137" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<text x="20" y="175" font-size="13" fill="#1a1a1a">Bare Array/String; byte strings, streams</text>
<text x="400" y="175" font-size="12" text-anchor="end" fill="#666">3, 10, 12</text>
<circle cx="464" cy="171" r="8" fill="#2f5d9e"/>
<circle cx="996" cy="171" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<rect x="10" y="188" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="209" font-size="13" fill="#1a1a1a">Dictionary on parallel arrays</text>
<text x="400" y="209" font-size="12" text-anchor="end" fill="#666">11</text>
<circle cx="464" cy="205" r="8" fill="#2f5d9e"/>
<circle cx="996" cy="205" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<text x="20" y="243" font-size="13" fill="#1a1a1a">No globals; platform; confined devices</text>
<text x="400" y="243" font-size="12" text-anchor="end" fill="#666">8, 9, 13, 17, 32</text>
<circle cx="641" cy="239" r="8" fill="#2f5d9e"/>
<rect x="10" y="256" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="277" font-size="13" fill="#1a1a1a">Reflection and debugger behind a mirror</text>
<text x="400" y="277" font-size="12" text-anchor="end" fill="#666">14, 15, 16</text>
<circle cx="641" cy="273" r="8" fill="#2f5d9e"/>
<text x="20" y="311" font-size="13" fill="#1a1a1a">Control flow lowered to bytecode</text>
<text x="400" y="311" font-size="12" text-anchor="end" fill="#666">19</text>
<circle cx="553" cy="307" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="819" cy="307" r="8" fill="#2f5d9e"/>
<rect x="10" y="324" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="345" font-size="13" fill="#1a1a1a">No NLR, no fibers, fixed stack</text>
<text x="400" y="345" font-size="12" text-anchor="end" fill="#666">21, 22, 23</text>
<circle cx="464" cy="341" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="819" cy="341" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="996" cy="341" r="8" fill="#2f5d9e"/>
<text x="20" y="379" font-size="13" fill="#1a1a1a">Errors are Records; predicate catch</text>
<text x="400" y="379" font-size="12" text-anchor="end" fill="#666">7, 24</text>
<circle cx="819" cy="375" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="907" cy="375" r="8" fill="#2f5d9e"/>
<rect x="10" y="392" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="413" font-size="13" fill="#1a1a1a">Closed immutable value algebra</text>
<text x="400" y="413" font-size="12" text-anchor="end" fill="#666">28</text>
<circle cx="907" cy="409" r="8" fill="#2f5d9e"/>
<text x="20" y="447" font-size="13" fill="#1a1a1a">One bounded integer, overflow traps</text>
<text x="400" y="447" font-size="12" text-anchor="end" fill="#666">29</text>
<circle cx="464" cy="443" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="907" cy="443" r="8" fill="#2f5d9e"/>
<rect x="10" y="460" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="481" font-size="13" fill="#1a1a1a">Compile-time symbols; RAM-only patching</text>
<text x="400" y="481" font-size="12" text-anchor="end" fill="#666">30, 31</text>
<circle cx="464" cy="477" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<circle cx="730" cy="477" r="8" fill="#2f5d9e"/>
<text x="20" y="515" font-size="13" fill="#1a1a1a">No class / perform: / thisContext</text>
<text x="400" y="515" font-size="12" text-anchor="end" fill="#666">26</text>
<circle cx="641" cy="511" r="8" fill="#2f5d9e"/>
<circle cx="730" cy="511" r="7" fill="none" stroke="#2f5d9e" stroke-width="2"/>
<rect x="10" y="528" width="1040" height="34" fill="#f2f4f7"/>
<text x="20" y="549" font-size="13" fill="#1a1a1a">Smaller syntax (no cascade, #( ), $a)</text>
<text x="400" y="549" font-size="12" text-anchor="end" fill="#666">27</text>
<circle cx="996" cy="545" r="8" fill="#2f5d9e"/>
<line x1="420" y1="120" x2="420" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="509" y1="120" x2="509" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="597" y1="120" x2="597" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="686" y1="120" x2="686" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="774" y1="120" x2="774" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="863" y1="120" x2="863" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="951" y1="120" x2="951" y2="562" stroke="#d0d4da" stroke-width="1"/>
<line x1="1040" y1="120" x2="1040" y2="562" stroke="#d0d4da" stroke-width="1"/>
<text x="20" y="592" font-size="12" fill="#555">Row 25 (access modifiers parsed, not enforced) has no driver: it was never decided. Sources: each row's Why column; first-step design 2026-07-03 §1.</text>
</svg>