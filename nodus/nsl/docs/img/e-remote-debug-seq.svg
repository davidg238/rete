<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="1040" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="24" y="34" font-size="21" font-weight="bold" fill="#111">Remote debug of a sleepy node, through porta</text>
<rect x="24" y="48" width="712" height="30" rx="6" fill="#fff4dc" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="380" y="68" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">DESIGNED — host spike built and gated; board not yet built</text>
<rect x="15" y="94" width="160" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="95" y="116" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Developer or agent</text>
<rect x="205" y="94" width="160" height="50" rx="8" fill="#fff4dc" stroke="#d4a72c" stroke-width="1.5"/>
<text x="285" y="116" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">custos</text>
<text x="285" y="134" font-size="12" fill="#333" text-anchor="middle">the developer's peer, HTTP</text>
<rect x="395" y="94" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#34a853" stroke-width="1.5"/>
<text x="475" y="116" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">porta</text>
<text x="475" y="134" font-size="12" fill="#333" text-anchor="middle">the gateway, holds a store</text>
<rect x="585" y="94" width="160" height="50" rx="8" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="665" y="116" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">node</text>
<text x="665" y="134" font-size="12" fill="#333" text-anchor="middle">asleep most of the time</text>
<line x1="95" y1="146" x2="95" y2="1020" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="285" y1="146" x2="285" y2="1020" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="475" y1="146" x2="475" y2="1020" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="665" y1="146" x2="665" y2="1020" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="97" y1="184" x2="283" y2="184" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="190.0" y="178" font-size="12.5" fill="#222" text-anchor="middle">1 set a breakpoint</text>
<line x1="287" y1="222" x2="473" y2="222" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="216" font-size="12.5" fill="#222" text-anchor="middle">2 write goal/debug/main</text>
<rect x="372" y="244" width="206" height="46" rx="6" fill="#ecfdf5" stroke="#34a853" stroke-width="1.5"/>
<text x="475.0" y="263" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">3 porta HOLDS it</text>
<text x="475.0" y="280" font-size="12.5" fill="#111" text-anchor="middle">the node is asleep</text>
<rect x="20" y="304" width="720" height="52" fill="#ffffff"/>
<line x1="20" y1="304" x2="740" y2="304" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="20" y1="356" x2="740" y2="356" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="380" y="335" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">the node sleeps: seconds to hours</text>
<line x1="663" y1="392" x2="477" y2="392" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="570.0" y="386" font-size="12.5" fill="#222" text-anchor="middle">4 wakes, checks in</text>
<line x1="477" y1="430" x2="663" y2="430" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="570.0" y="424" font-size="12.5" fill="#222" text-anchor="middle">4 breakpoint pulled</text>
<rect x="545" y="450" width="190" height="46" rx="6" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="640.0" y="469" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">5 runs to the</text>
<text x="640.0" y="486" font-size="12.5" fill="#111" text-anchor="middle">breakpoint, stops</text>
<line x1="663" y1="520" x2="477" y2="520" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="570.0" y="514" font-size="12.5" fill="#222" text-anchor="middle">5 stop reported on dbg/resp</text>
<line x1="473" y1="556" x2="289" y2="556" stroke="#444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="380.0" y="550" font-size="12.5" fill="#222" text-anchor="middle">5 stop seen</text>
<line x1="283" y1="580" x2="99" y2="580" stroke="#444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="190.0" y="574" font-size="12.5" fill="#222" text-anchor="middle">host: 9.9 s, one 10 s cadence</text>
<rect x="545" y="590" width="190" height="29" rx="6" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="640.0" y="609" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">6 stays awake, held</text>
<rect x="16" y="624" width="270" height="40" fill="#ffffff"/>
<text x="24" y="640" font-size="13" font-weight="bold" fill="#111">7 step and inspect commands</text>
<text x="24" y="658" font-size="12.5" fill="#333">each round trip 3 to 4 ms on host loopback</text>
<line x1="97" y1="690" x2="283" y2="690" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="190.0" y="684" font-size="12.5" fill="#222" text-anchor="middle">command</text>
<line x1="287" y1="720" x2="473" y2="720" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="714" font-size="12.5" fill="#222" text-anchor="middle">command</text>
<line x1="477" y1="750" x2="663" y2="750" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="570.0" y="744" font-size="12.5" fill="#222" text-anchor="middle">command</text>
<line x1="663" y1="780" x2="477" y2="780" stroke="#444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="570.0" y="774" font-size="12.5" fill="#222" text-anchor="middle">reply</text>
<line x1="473" y1="810" x2="287" y2="810" stroke="#444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="380.0" y="804" font-size="12.5" fill="#222" text-anchor="middle">reply</text>
<line x1="283" y1="840" x2="97" y2="840" stroke="#444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="190.0" y="834" font-size="12.5" fill="#222" text-anchor="middle">reply</text>
<text x="24" y="876" font-size="13" font-weight="bold" fill="#111">8 continue</text>
<line x1="97" y1="902" x2="283" y2="902" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="190.0" y="896" font-size="12.5" fill="#222" text-anchor="middle">continue</text>
<line x1="287" y1="932" x2="473" y2="932" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="926" font-size="12.5" fill="#222" text-anchor="middle">continue</text>
<line x1="477" y1="962" x2="663" y2="962" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="570.0" y="956" font-size="12.5" fill="#222" text-anchor="middle">continue</text>
<rect x="545" y="982" width="190" height="46" rx="6" fill="#e8f0fb" stroke="#9db7dd" stroke-width="1.5"/>
<text x="640.0" y="1001" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">node resumes,</text>
<text x="640.0" y="1018" font-size="12.5" fill="#111" text-anchor="middle">later sleeps</text>
</svg>