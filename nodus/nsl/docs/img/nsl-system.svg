<text x="24" y="34" font-size="21" font-weight="bold" fill="#111">The system: field nodes, the gateway, and developers with their twins</text>
<text x="24" y="56" font-size="13" fill="#555">Solid lines work today; dashed is designed, not built. Blue is nsl on the VM.</text>
