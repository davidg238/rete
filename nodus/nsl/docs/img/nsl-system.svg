<text x="610" y="350" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">Each node starts every exchange,</text>
<text x="610" y="367" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">so a node that sleeps or reboots</text>
<text x="610" y="384" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">needs no address.</text>
