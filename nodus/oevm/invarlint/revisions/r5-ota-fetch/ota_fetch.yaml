# nsl, in nodus/nsl/lib/kernel.nsl: invarlint reads C only, so this card binds nothing, and an unbound card fails the
# gate. It waits here beside PortaBridge (r2-check-in/) until invarlint reads nsl (invarlint#177); the suite, the
# host_ota gate and #449's OTA over BLE hold it.
name: OtaFetch
stereotype: coordinator
knows:
  - "the wanted image's hash and the block it waits for; the stage's length is the cursor, so a fetch resumes where the last one stopped"
    # nodus/nsl/lib/kernel.nsl: OtaFetch>>start: (block = size // blockSize); docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: addendum 2026-11-10, Kept from T9 unchanged
  - "the attempts left on the block, from its retry budget"
    # nodus/nsl/lib/kernel.nsl: OtaFetch>>maxAttempts, attemptBudget, lapsed:; docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: addendum 2026-11-10, Kept from T9 unchanged
  - "the block plane is the peer's port plus one, by construction"
    # nodus/nsl/lib/kernel.nsl: PortaBridge>>otaCheck (the block plane comment)
does:
  - "one state per block: sends the request, arms its budget, and is moved on by the reply's doorbell on the bridge's own socket or the budget, never by a wait"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Revisions, in order (R5); The rule, in one sentence
  - "appends each block to the stage and verifies the whole image's hash at the end; a mismatch empties the stage"
    # nodus/nsl/lib/kernel.nsl: OtaFetch>>arrived:, verify; docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: addendum 2026-11-10, Kept from T9 unchanged
  - "a peer error ends the fetch unretried; on a resume it also empties the stage, so a retarget cannot wedge the node"
    # nodus/nsl/lib/kernel.nsl: OtaFetch>>arrived: (0x7F), rejected; docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: addendum 2026-11-10, Kept from T9 unchanged
  - "an exhausted budget ends the fetch and keeps the stage, and the next check-in resumes it"
    # nodus/nsl/lib/kernel.nsl: OtaFetch>>lapsed: (porta is unreachable), PortaBridge>>otaCheck step 5 (a failed stage is not remembered); docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: addendum 2026-11-10, Kept from T9 unchanged
  - "the bridge reports finished only when neither an exchange nor a fetch is in flight, so a run-once node sleeps after its stage"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Decided by David (2026-11-05), a run-once node is event-driven; addendum 2026-11-10 (R5)
collaborators:
  - {to: Net, mode: async-event}
  - {to: Timer, mode: async-event}
  - {to: Ota, mode: sync-call}
  - {to: PortaBridge, mode: sync-call}
implemented_by: []
