# Accepted by David, 2026-10-18 (invarlint#48): Symbol_value and Symbol_debug_ are set by
# kernel_boot, and interned lazily when NULL by run_interpreter and the debugger hook — the path a
# link without kernel_boot (Model A, most host tests) takes. Moved out of Boot's owns.
name: WellKnownSymbols
does:
  - the symbols the interpreter compares by identity, set at boot or interned on first use
owns:
  - global:Symbol_value
  - global:Symbol_debug_
implemented_by:
  - c: kernel_boot
  - c: run_interpreter
  - c: primitive_register_debugger_hook
  - c: gc_collect      # rete#477: the moving collector rewrites every root it relocates (David, 2026-11-10)
  - c: gc_compact
