# intended design: the seam, 2026-11-05 (refs #440). The mailbox every arrival rings, and the one wait.
name: Pulse
stereotype: interfacer
root: true
context: adapters
knows:
  - "a post is an immediate or a handle, never a heap pointer across the queue"
    # src/pulse_backend.h: file comment, pulse_post_isr_value
  - "a post from a source already pending merges; a full mailbox sheds and counts, and never aborts"
    # src/pulse_backend.h: pulse_post_isr
does:
  - "blocks the VM thread: the only place it blocks, with no deadline, because a deadline is a timer"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: The rule, in one sentence
  - "moves each post onto its channel in thread context"
    # src/pulse_backend.h: file comment
owns:
  - global:pulse_q
  - global:src/backend/zephyr/pulse_zephyr.c:*
implemented_by:
  - c: "pulse_*"
