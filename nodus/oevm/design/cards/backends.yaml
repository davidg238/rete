# The Zephyr adapters' port (DDD port/adapter): every function a src/*_backend.h header declares
# and src/backend/zephyr defines. One context: the nine backends share the unit, and a c: binding
# cannot scope an exported function to its file. platform_debug_hold is DebugHold's (debug.yaml).
name: ZephyrBackends
root: true
does:
  - the platform seams oevm's core is written against, one adapter linked per target
implemented_by:
  # src/http_backend.h
  - c: http_accept_failures
  - c: http_close
  - c: http_emit
  - c: http_is_listening
  - c: http_listen
  - c: http_poll
  - c: http_write
  # src/ota_backend.h
  - c: ota_env
  - c: ota_exit_stage_ready
  - c: ota_note_running_hash
  - c: ota_sleep_ms
  - c: ota_stage_append
  - c: ota_stage_read
  - c: ota_stage_size
  - c: ota_stage_truncate
  - c: ota_thread_start
  - c: ota_touch_confirm
  - c: ota_write_ready
  # src/platform_backend.h
  - c: platform_backend_board_name
  - c: platform_backend_boot_id
  - c: platform_backend_node_id
  - c: platform_console_arm
  - c: platform_console_drain
  - c: platform_console_err
  - c: platform_console_flush
  - c: platform_console_service
  - c: platform_console_take_line
  - c: platform_console_tee
  - c: platform_console_write
  - c: platform_debug_enabled
  - c: platform_debug_held
  - c: platform_debug_readline
  # src/pulse_backend.h
  - c: pulse_coalesced
  - c: pulse_drained
  - c: pulse_drops
  - c: pulse_pending
  - c: pulse_post_isr
  - c: pulse_post_isr_value
  - c: pulse_pump
  - c: pulse_pump_nb
  - c: pulse_stale
  # src/sensor_backend.h
  - c: sensor_arm
  - c: sensor_read
  # src/serial_backend.h
  - c: serial_at_end
  - c: serial_open
  - c: serial_read_byte
  - c: serial_write_byte
  # src/span_backend.h
  - c: span_elapsed_us
  - c: span_stamp
  # src/timer_backend.h
  - c: timer_backend_advance
  - c: timer_backend_after
  - c: timer_backend_cancel
  - c: timer_backend_every
  - c: timer_backend_millis
  - c: timer_backend_poll
  # src/udp_backend.h
  - c: udp_close
  - c: udp_open
  - c: udp_receive
  - c: udp_send
  - c: udp_socket_bind
