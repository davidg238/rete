name: Http
stereotype: interfacer
root: true
context: adapters
knows:
  - "the listener and its open connections"
    # src/http_backend.h: file comment
does:
  - "rings the listener's channel when a client is ready, and reads nothing itself; accept, read and parse stay on the VM thread"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals
  - "when it cannot accept for want of buffers, counts it, stops listening, and listens again after a pause, so a wedged listener idles instead of spinning"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals (David, 2026-11-07); #65
  - "answers whether it accepted, so the reaction reads the listener to empty"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals
  - "writes a framed reply and closes the connection"
    # src/http_backend.h: http_write, http_close
owns:
  - global:src/backend/zephyr/http_zephyr.c:*
implemented_by:
  - c: http_accept_failures
  - c: http_close
  - c: http_emit
  - c: http_listen
  - c: http_poll
  - c: http_write
