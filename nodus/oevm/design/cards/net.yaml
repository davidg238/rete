name: Net
stereotype: interfacer
root: true
context: adapters
knows:
  - "the sockets, over Thread, WiFi, the BLE relay or posix; addresses are plain strings and the backend owns the family"
    # src/udp_backend.h: file comment; docs/design/2026-10-23-439-ble-relay-design.md: The mechanism
  - "whether the link is up"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: The cards (intended); #458
does:
  - "rings a VM socket's channel when a datagram has arrived, after it can be read, then leaves that socket alone until the VM's receive answers empty"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals
  - "rings the link channel when the link goes up or down"
    # docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals
  - "hands over a waiting datagram without blocking, and answers when none waits"
    # src/udp_backend.h: udp_receive
  - "closes a VM socket only once the reader has let go of it: the one wait on the VM thread outside the pump, bounded by one pass of the reader"
    # src/backend/zephyr/udp_zephyr.c: bell_forget; docs/design/2026-11-04-440-vm-zephyr-seam-crc-design.md: Arrivals
owns:
