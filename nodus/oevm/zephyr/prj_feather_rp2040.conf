# oevm/zephyr — Adafruit Feather RP2040 (RP2040, Cortex-M0+) boot-&-run Kconfig.
#
# Selected with:
#   bash zephyr/run.sh --board feather_rp2040 ...
# built against ~/zephyr-esp32 (NOT NCS) on the out-of-tree board under
# zephyr/boards/adafruit/feather_rp2040/ (this tree has no Feather RP2040).
#
# THE REHEARSAL BOARD FOR rete#302, not a target in its own right (2026-09-19). The
# Pico 2s were in the post; this was on the desk. What it rehearses is everything in
# the RP2 loop that is the same on both parts — BOOTSEL/UF2 on this desktop, the
# uart0 adapter on GP0/GP1, the layout capture, TimerNode under the pico-sdk HAL —
# plus the ONE thing the RP2350 cannot do in this tree: NVS on the RP2 flash, because
# the RP2040 has a Zephyr flash driver and the RP2350 does not (prj_rpi_pico2.conf).
#
# What it cannot give is #302's number. An M0+ at 133 MHz — Thumb-1, no hardware
# divide, no FPU — is a different core from the M33 cabot's M28 gates on. It is
# weaker on every axis, so an M0+ time UNDER the C6's 11.83 µs would make the M33
# passing near-certain; a time over it says nothing. Do not put an M0+ figure on #301.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
# No CONFIG_FPU: the M0+ has none. Every VM float is a soft-float libcall, as on the
# C6 — a float row from this board says "soft-float" or it is not a row.

# Net stack WITHOUT a radio — linked unconditionally on every board (dispatch.c's
# udp_object() probe); see prj_esp32c6.conf / prj_rpi_pico2.conf for the reasoning.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
# No entropy driver for the RP2040 either; same degenerate, non-cryptographic source
# as the Pico 2, for the same reason (nothing here ever sends a packet).
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- rete#215: the wedge detector's timeout path -----------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
# NOT the C6's 10000 + 1000. wdt_rpi_pico.c's ceiling on the RP2040 is HALVED by
# errata RP2040-E1 to 0x7fffff µs = 8.39 s; the C6's 11 s window is refused with
# -EINVAL and the observer prints "wedge detection is OFF" once at boot, then runs
# unguarded (prj_rpi_pico2.conf records the same edge from the other side, where
# 11 s fits under 16.78 s). 7 + 1 = 8 s is the largest whole second that fits.
CONFIG_TASK_WDT_MIN_TIMEOUT=7000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# --- rete#162 bootId: settings/NVS on the RP2 flash — THE point of this board ----
# adafruit_feather_rp2040.dts carves storage_partition (64 KB, the last 16 sectors
# of the 8 MB part). FLASH_RPI_PICO defaults y under CONFIG_FLASH with the ssi
# controller enabled (the RP2040 path — the one the RP2350 lacks). With these,
# platform_backend_boot_id() takes its CONFIG_SETTINGS branch and the node declares
# a bootId that climbs across resets; without them it declares 0.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# rete#118: node id = the flash serial via hwinfo — an RP board has no radio, so no link
# address (platform_zephyr.c; its #error fires without this). The same bytes the USB stack
# prints as the serial string.
CONFIG_HWINFO=y
