# Throwaway app: compiles tools/dump_layout.c for the ESP32 ABI and prints the
# struct layout JSON over the console. Its output is banked as
# zephyr/layout-esp32.json and fed to the Model B bake as --layout.
#
# Regenerate only when a struct in src/ or the toolchain changes.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PICOLIBC=y
# rev-1.0 silicon: without this the bootloader HALTS at soc_init and main never runs.
# (Same opt-in as prj_esp32.conf — the bench board is an ESP32-D0WDQ6 rev v1.0.)
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
