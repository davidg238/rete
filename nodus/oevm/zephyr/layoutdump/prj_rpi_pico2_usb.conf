# layoutdump for the RP2350 over its OWN USB — the no-solder capture.
#
# prj_rpi_pico2.conf is the UART capture (uart0 on GP0/GP1 through an adapter) and
# names this file as its fallback: "if the desk has only a USB cable, the dongle
# recipe is the fallback — a second conf, not an edit to this one". This is that
# file. Same ABI, same toolchain, same dump_layout.c; the ONLY difference is where
# the bytes come out, and a struct offset cannot depend on that. Written 2026-09-21
# for rete#302 on a Waveshare RP2350-Zero (an RP2350A like the Pico 2, 2 MB flash,
# native USB on its USB-C; no GP0/GP1 adapter soldered yet).
#
# The console is the RP2350's usbd node publishing a CDC-ACM port: Zephyr v4.2's
# udc_rpi_pico.c (default y once the node is okay, which rpi_pico2.dtsi does) under
# USB_DEVICE_STACK_NEXT. Everything below is prj_dongle.conf's block verbatim and
# for the dongle's reasons — read that file's header, it was earned by two empty
# captures. In one line each:
#   CDC_ACM_SERIAL_INITIALIZE_AT_BOOT  nothing else starts USB; without it the app
#                                      boots silently (prj_dongle_thread.conf Issue A)
#   UART_LINE_CTRL                     the first console write BLOCKS until a host
#                                      asserts DTR — the JSON waits for the reader
#   hw-flow-control (usb-console.overlay)  the CDC ring buffer DISCARDS under burst
#                                      without it; the dump is one ~3.5 KB burst
#   BOOT_DELAY=20000                   the console does not EXIST until USB
#                                      enumerates after the post-UF2 reset
# Build (this file + the overlay, from the ~/zephyr-esp32 venv):
#   west build -b rpi_pico2/rp2350a/m33 -d build-pico2-usb . -- \
#     -DCONF_FILE=prj_rpi_pico2_usb.conf -DEXTRA_DTC_OVERLAY_FILE=usb-console.overlay
# Capture: hold BOOT, plug in (or BOOT + tap RUN on the Zero) → 2e8a:000f mounts as
# RP2350 → copy build-pico2-usb/zephyr/zephyr.uf2 onto it → the board resets and
# re-enumerates as a CDC port (a NEW ttyACM, the ROM's disk is gone) → within 20 s:
#   python3 capture.py /dev/serial/by-id/usb-ZEPHYR_*-if00 ../layout-rp2350.json \
#     --ref ../layout-esp32c6.json
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_COMPLETE=y

# No CONFIG_RESET_ON_FATAL_ERROR=n: that symbol is NCS's, and upstream aborts the
# build on an unknown symbol (prj_rpi_pico2.conf). Upstream's default halts anyway.

# picolibc + hard float, exactly as prj_rpi_pico2.conf — the layout is captured under
# the libc and float ABI the node image builds with.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_BOOT_DELAY=20000
