# layoutdump for the RP2040 (Adafruit Feather RP2040, out-of-tree board under
# zephyr/boards/adafruit/) ABI. rete#302's REHEARSAL: the Pico 2s were in the post,
# and every step of the RP2 loop but the core itself — BOOTSEL/UF2 on this desktop,
# the uart0 adapter on GP0/GP1, this capture, TimerNode under the pico-sdk HAL —
# is the same on both parts. Output banked as zephyr/layout-rp2040.json.
#
#   west build -b adafruit_feather_rp2040 -d build-feather zephyr/layoutdump \
#     -- -DCONF_FILE=prj_feather_rp2040.conf
#
# A Cortex-M0+ under the same arm-zephyr-eabi ILP32 rules as the nRF's M4F and the
# Pico 2's M33 — identical to those is the expectation; the file is still this
# target's own (see prj_rpi_pico2.conf). Same console shape as the Pico 2: uart0 on
# an external adapter that stays enumerated across resets.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# No CONFIG_FPU: the M0+ has none (and the option is not selectable for it).
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BOOT_DELAY=3000
