# layoutdump for the RP2350 (Raspberry Pi Pico 2, rpi_pico2/rp2350a/m33) ABI.
# Throwaway app: compiles tools/dump_layout.c and prints the struct layout JSON
# over the console. Output is banked as zephyr/layout-rp2350.json and fed to the
# Model B bake as --layout. rete#302 Task 2.
#
# Build (same west workspace as the C6 — ~/zephyr-esp32, NOT ~/ncs):
#   west build -b rpi_pico2/rp2350a/m33 -d build-layoutdump-pico2 zephyr/layoutdump \
#     -- -DCONF_FILE=prj_rpi_pico2.conf
#
# A layout must be dumped per target because you cannot know it matches until you
# look. layout-esp32c6.json and layout-nrf52840.json came out byte-identical (Xtensa,
# RV32 and a Cortex-M4F under the same ILP32 GCC rules), and this M33 build uses the
# same arm-zephyr-eabi toolchain the nRF does — so identical is the EXPECTED outcome,
# and run.sh still refuses to bake without this target's own file (the -m32 proxy was
# found unsafe once, review/program-sequence.md).
#
# Console: uart0 (GP0 TX / GP1 RX), the board default. The Pico 2 has NO on-board
# USB-UART bridge, so uart0 rides whatever adapter is wired to those pins — and that
# adapter stays enumerated across the board's resets, which is what makes this
# capture the C6's shape (open the reader first, then flash) rather than the
# dongle's (BOOT_DELAY + LINE_CTRL to wait for a USB host). If the desk has only a
# USB cable, the dongle recipe (prj_dongle.conf) is the fallback: USB-CDC via the
# rp2350's usbd node — a second conf, not an edit to this one.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_COMPLETE=y

# No CONFIG_RESET_ON_FATAL_ERROR=n here, unlike prj_dongle.conf: that symbol is
# NCS's (sdk-nrf), not upstream Zephyr's, and this tree aborts the build on an
# unknown symbol. Upstream's default fatal handler halts, which is the outcome the
# dongle line was buying.

# picolibc, as the node image will use. The libc cannot move an oevm struct offset,
# but the layout is captured under the libc the consumer builds with.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# Hardware float ON, as on the nRF52840 (M4F) and Xtensa ESP32 — the C6 is the odd
# one out with none. struct Float's 8-byte double alignment is an ABI fact either
# way; -mfloat-abi=hard is what the node image builds with, so capture under it.
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=2048

# A short window between the post-flash reset and main(): with a UART adapter the
# reader is already open, so this is insurance against a reader started late, not a
# gate. The dongle needed 20 s because its console did not EXIST until USB enumerated.
CONFIG_BOOT_DELAY=3000
