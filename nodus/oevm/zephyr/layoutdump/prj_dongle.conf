# layoutdump for the nRF52840 DONGLE (PCA10059) ABI. Throwaway app: compiles
# tools/dump_layout.c and prints the struct layout JSON over the console. Output is
# banked as zephyr/layout-nrf52840.json and fed to the Model B bake as --layout.
# rete#281 item 2 — until this file existed, nRF was Model A only, which is the
# ~4.9 GB / ~50 min cc1 bake run.sh:426 warns has OOM-killed a desktop.
#
# ONE layout serves both nRF boards. The DK and the dongle are the same part, the
# same arm-zephyr-eabi toolchain and the same ABI; the differences run.sh encodes
# between them (console, trigger pin, flash method) are Kconfig and devicetree, and
# a struct offset cannot depend on any of them. The dongle is the one that got the
# run because it is the board on the bench, not because the ABI is the dongle's.
#
# --- Console: SoC USB-CDC ACM, and the capture depends on it ---------------------
#
# The dongle has NO debugger and no VCOM: the console is the SoC's own USB-CDC,
# published by this application. The block below is Zephyr's supported recipe and
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT is its load-bearing line — without it nothing
# ever starts USB and the app boots silently (prj_dongle_thread.conf's "Issue A",
# which read as a radio fault for two rungs).
#
# UART_LINE_CTRL=y IS WHY THIS CAPTURE IS NOT A RACE. dump_layout.c's main() prints
# once and returns, so an output printed before the host opens the port would be
# lost with no way to tell an empty capture from a broken one. With LINE_CTRL the
# first console write BLOCKS until a host opens the port and asserts DTR — so the
# JSON waits for the reader instead of the reader waiting for the JSON. Read it with
# pyserial dtr=True, never `cat`.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_COMPLETE=y

# A fatal error must leave EVIDENCE rather than reboot into a fresh boot that looks
# healthy — the failure mode that hid the dongle's silence for two rungs.
CONFIG_RESET_ON_FATAL_ERROR=n

# picolibc, as every other dongle image here uses. The libc choice cannot move a
# struct offset (these are oevm's own structs, no libc type among them), but the
# layout is captured to be USED by the dongle build, so it is captured under the
# dongle build's libc rather than a different one.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# No networking, no NVS, no settings: this app prints and stops. That is also why it
# needs no pm_static_dongle.yml — it has no settings_storage partition to collide
# with the Open Bootloader's pages, which is the only reason that file exists.
CONFIG_MAIN_STACK_SIZE=2048

# BOOT_DELAY IS WHAT MAKES THIS CAPTURE REPRODUCIBLE, and it was earned by a failed
# run. dump_layout.c prints ONCE from main() and returns — it is shared with the host
# gate, which regenerates the layout every nsl suite run, so it must not be given a
# print loop. On the dongle the console does not exist until USB enumerates after the
# post-DFU reset, and the first attempt captured NOTHING: main had run, printed into a
# console with no host, and returned, ~4 s before a reader could open the port.
# UART_LINE_CTRL does not save this — it gates writes through the console API the VM's
# platform_console_write uses, not printf's path out of a bare Zephyr app.
#
# 20 s is the window to open the port after the flash resets the board. An empty
# capture is therefore now a real fault, not a mistimed one.
CONFIG_BOOT_DELAY=20000
