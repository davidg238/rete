# oevm/zephyr — ESP32-S2 (MagTag) PSRAM overlay. tuvm#94.
#
# Layered on prj_esp32s2.conf:
#   bash zephyr/run.sh --board esp32s2 --conf-extra prj_esp32s2_psram.conf ...
#
# WHY THIS EXISTS. The MagTag's module is the ESP32-S2-WROVER (N4R2): 4 MB flash
# and 2 MB PSRAM. Nothing has ever used that PSRAM — the board has run entirely
# out of the 217 KB dram0, and #85 recorded the reclaim path as unproven.
# It becomes load-bearing the moment WiFi is linked: measured against #85's
# overflow, WiFi's full static cost on this part is ~73 KB, against ~31 KB free
# in a display+DAC build. Moving the WiFi adapter heap to PSRAM takes
# HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI from 40960 to 19456 (a 21504 B reclaim, see
# zephyr/drivers/wifi/esp32/Kconfig.esp32:24-27) — which closes about half the
# gap; the arena has to give up the rest.
#
# NOTHING HERE IS BESPOKE. ESP_SPIRAM is a first-class option for
# SOC_SERIES_ESP32S2 (soc/espressif/common/Kconfig.spiram:8), it `select`s
# SHARED_MULTI_HEAP, and ESP_SPIRAM_SIZE defaults straight out of the
# devicetree — esp32s2_wrover_n4r2.dtsi:15 ALREADY declares the 2 MB, and
# esp32s2_saola.dts includes that dtsi. So size, mode (QUAD) and type
# (ESPPSRAM16, the default when ESP_SPIRAM_SIZE == 2097152) all derive with no
# further configuration.
CONFIG_ESP_SPIRAM=y

# ESP_SPIRAM_MEMTEST is default y and is kept ON DELIBERATELY for bring-up: it
# is a free boot-time pass/fail on hardware that has never been exercised, and
# this board has a documented history of faults that read as silence rather than
# as errors. Turn it off later for boot speed, not now.
#
# CONFIG_ESP_WIFI_HEAP_SPIRAM IS NOT HERE ON PURPOSE. It sits inside
# `if WIFI_ESP32` (drivers/wifi/esp32/Kconfig.esp32:22,31-41), so it is
# meaningless without the WiFi driver and belongs in the WiFi overlay. Keeping
# this file PSRAM-only also keeps the bring-up honest: gate 0 asks exactly one
# question — does this board's PSRAM initialise at all — and a failed memtest
# here cannot be confused with a WiFi problem.

# BISECT (tuvm#94 gate 0): boot stops dead immediately after
# "esp_psram: SPI SRAM memory test OK", deterministically, with NO further output.
# The path after that is short — soc/espressif/esp32s2/soc.c:48-56 does
# esp_init_psram() -> esp_psram_smh_init() -> z_prep_c() — and a FAILURE in
# esp_psram_smh_init printks an error and continues, so silence means a HANG, not
# an error return. The suspect is shared_multi_heap_add() over the default 1 MB
# region (ESP_SPIRAM_HEAP_SIZE defaults to 1048576 when !SYS_HEAP_SMALL_ONLY).
# Shrink it and change nothing else: if it boots, the size is implicated; if it
# still hangs, the SMH region is exonerated and the fault is in z_prep_c or the
# cache reconfiguration.
CONFIG_ESP_SPIRAM_HEAP_SIZE=65536
