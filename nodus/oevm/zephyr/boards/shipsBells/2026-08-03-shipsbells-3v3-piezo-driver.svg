<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1240" viewBox="0 0 1560 1240">
  <style>
    .wire  { stroke:#111; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .comp  { stroke:#111; stroke-width:3.5; fill:none; stroke-linecap:round }
    .fill  { fill:#111; stroke:none }
    .box   { fill:#fff; stroke:#111; stroke-width:3 }
    .newbox{ fill:#fff; stroke:#b3261e; stroke-width:3.5 }
    .neww  { stroke:#b3261e; stroke-width:3.5; fill:none; stroke-linecap:round }
    .lbl   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; fill:#111 }
    .val   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#111 }
    .valr  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#b3261e }
    .pin   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; font-weight:bold; fill:#111 }
    .note  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#1a4f8a }
    .warn  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#b3261e }
    .title { font-family:'DejaVu Sans',Arial,sans-serif; font-size:27px; font-weight:bold; fill:#111 }
    .sub   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#444 }
    .step  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#111 }
    .stepr { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#b3261e }
    .term  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:24px; font-weight:bold; fill:#111 }
  </style>

  <rect x="0" y="0" width="1560" height="1240" fill="#ffffff"/>

  <text class="title" x="40" y="44">Ship's bell v3 — 3.3 V piezo bench driver (low-side NPN)   ·   rev B, 2026-08-05</text>
  <text class="sub"   x="40" y="74">Parts: 2N3904 · 1N5819 · R1 10 k · R2 47 k.   Load = continuous-tone piezo, 3–24 V DC, 15 mA @ 12 V.</text>
  <text class="warn"  x="40" y="102">rev B adds R2, the base pull-down (#105) — it silences the ~1 s energisation at boot and at every reset. It does NOT cover a SOLID tone: see note 9.</text>

  <!-- ===== +3.3 V rail ===== -->
  <line class="wire" x1="170" y1="150" x2="900" y2="150"/>
  <circle class="fill" cx="170" cy="150" r="7"/>
  <text class="val"  x="186" y="180">+3.3 V</text>
  <text class="note" x="186" y="204">C6 3V3 pin</text>

  <!-- ===== GND rail ===== -->
  <line class="wire" x1="170" y1="700" x2="900" y2="700"/>
  <line class="wire" x1="620" y1="700" x2="620" y2="726"/>
  <line class="comp" x1="590" y1="726" x2="650" y2="726"/>
  <line class="comp" x1="600" y1="737" x2="640" y2="737"/>
  <line class="comp" x1="610" y1="748" x2="630" y2="748"/>
  <text class="val" x="660" y="734">GND</text>

  <!-- ===== C6 ===== -->
  <rect class="box" x="60" y="420" width="150" height="140" rx="8"/>
  <text class="lbl" x="76" y="470">ESP32-C6</text>
  <text class="lbl" x="76" y="498">DevKitC-1</text>
  <text class="pin" x="216" y="478">GPIO18</text>
  <text class="pin" x="216" y="556">GND</text>
  <line class="wire" x1="210" y1="490" x2="310" y2="490"/>
  <line class="wire" x1="210" y1="530" x2="280" y2="530"/>
  <line class="wire" x1="280" y1="530" x2="280" y2="700"/>
  <circle class="fill" cx="280" cy="700" r="6"/>

  <!-- ===== R1 base series ===== -->
  <rect class="box" x="310" y="472" width="76" height="36"/>
  <text class="val" x="348" y="462" text-anchor="middle">10 k</text>
  <text class="lbl" x="348" y="534" text-anchor="middle">R1</text>
  <line class="wire" x1="386" y1="490" x2="448" y2="490"/>

  <!-- ===== R2 base pull-down (NEW in rev B) ===== -->
  <circle class="fill" cx="417" cy="490" r="6"/>
  <line class="neww" x1="417" y1="490" x2="417" y2="556"/>
  <rect class="newbox" x="399" y="556" width="36" height="76"/>
  <line class="neww" x1="417" y1="632" x2="417" y2="700"/>
  <circle class="fill" cx="417" cy="700" r="6"/>
  <text class="valr" x="384" y="586" text-anchor="end">47 k</text>
  <text class="valr" x="384" y="612" text-anchor="end">R2</text>
  <text class="warn" x="390" y="748" text-anchor="end">NEW — holds the base at 0 V</text>
  <text class="warn" x="390" y="772" text-anchor="end">whenever GPIO18 is undriven</text>

  <!-- ===== 2N3904 ===== -->
  <circle class="comp" cx="480" cy="490" r="45"/>
  <line class="comp" x1="448" y1="456" x2="448" y2="524"/>
  <line class="wire" x1="448" y1="470" x2="496" y2="442"/>
  <line class="wire" x1="448" y1="510" x2="496" y2="538"/>
  <polygon class="fill" points="496,538 479,533 486,523"/>
  <line class="wire" x1="496" y1="442" x2="496" y2="300"/>
  <line class="wire" x1="496" y1="538" x2="496" y2="700"/>
  <circle class="fill" cx="496" cy="700" r="6"/>
  <text class="pin" x="424" y="452">B</text>
  <text class="pin" x="512" y="428">C</text>
  <text class="pin" x="512" y="566">E</text>
  <text class="val" x="600" y="606">2N3904</text>
  <text class="lbl" x="600" y="632">NPN — now the switch itself,</text>
  <text class="lbl" x="600" y="658">not a level shifter</text>
  <text class="note" x="600" y="686">V_CE(sat) ≈ 0.2 V, so the piezo sees ~3.1 V</text>

  <!-- ===== piezo ===== -->
  <rect class="box" x="446" y="200" width="100" height="100" rx="10"/>
  <line class="wire" x1="496" y1="200" x2="496" y2="150"/>
  <circle class="fill" cx="496" cy="150" r="6"/>
  <text class="term" x="558" y="222">+</text>
  <text class="term" x="558" y="298">−</text>
  <path class="comp" d="M 596 224 A 34 34 0 0 1 596 276"/>
  <path class="comp" d="M 616 208 A 56 56 0 0 1 616 292"/>
  <text class="val"  x="430" y="222" text-anchor="end">PIEZO</text>
  <text class="lbl"  x="430" y="248" text-anchor="end">3–24 V DC</text>
  <text class="lbl"  x="430" y="274" text-anchor="end">continuous tone</text>
  <text class="lbl"  x="430" y="300" text-anchor="end">while powered</text>
  <text class="note" x="700" y="380" text-anchor="middle">probe the collector during bring-up</text>

  <!-- ===== 1N5819 clamp ===== -->
  <line class="wire" x1="760" y1="150" x2="760" y2="230"/>
  <circle class="fill" cx="760" cy="150" r="6"/>
  <line class="comp" x1="728" y1="230" x2="792" y2="230"/>
  <polygon class="comp" points="728,282 792,282 760,230" fill="#fff"/>
  <line class="wire" x1="760" y1="282" x2="760" y2="340"/>
  <line class="wire" x1="760" y1="340" x2="496" y2="340"/>
  <circle class="fill" cx="496" cy="340" r="6"/>
  <text class="val"  x="812" y="224">1N5819</text>
  <text class="warn" x="812" y="252">BANDED END</text>
  <text class="warn" x="812" y="276">goes UP, to</text>
  <text class="warn" x="812" y="300">the 3.3 V rail</text>
  <text class="note" x="812" y="330">optional — cheap insurance</text>

  <!-- ===== power warning ===== -->
  <rect x="960" y="420" width="560" height="180" rx="8" fill="#fdf3f2" stroke="#b3261e" stroke-width="2"/>
  <text class="valr" x="984" y="456">Power the C6 from 5 V — #149 (closed)</text>
  <text class="step" x="984" y="488">Feed 5 V and let the module's onboard LDO make</text>
  <text class="step" x="984" y="514">3.3 V. Injecting 3.3 V directly leaves the regulator</text>
  <text class="step" x="984" y="540">no headroom; the board brown-out resets in a loop,</text>
  <text class="step" x="984" y="566">and with R2 absent each reset chirps. CHIRPING, not a</text>
  <text class="step" x="984" y="592">solid tone — the two symptoms have different causes.</text>

  <!-- ===== notes ===== -->
  <line x1="40" y1="800" x2="1520" y2="800" stroke="#bbb" stroke-width="2"/>
  <text class="val"  x="40" y="836">How it behaves — and what changed</text>
  <text class="stepr" x="40" y="868">1.  R2 IS THE POINT OF rev B. A Zephyr output is de-energised only from when wire_gpio_outputs() runs; before that GPIO18 is a floating input, and</text>
  <text class="stepr" x="40" y="896">     with only R1 the base floats with it. R2 pins the base to GND across that window, across a reset, and with the C6 unplugged entirely.</text>
  <text class="step" x="40" y="924">2.  GPIO18 low OR UNDRIVEN (boot, reset, unplugged)  →  base held at 0 V  →  2N3904 off  →  silent. GPIO18 high  →  saturates  →  piezo − at ~0.2 V  →  tone.</text>
  <text class="step" x="40" y="952">3.  Polarity is UNCHANGED from the 12 V board — still active-high. No firmware inversion needed, and none is wanted: the overlay declares GPIO18</text>
  <text class="step" x="40" y="980">     ACTIVE_HIGH so GPIO_OUTPUT_INACTIVE drives it physically low at boot. R2 covers the window before that line executes; it does not replace it.</text>
  <text class="step" x="40" y="1008">4.  Divider: GPIO high clamps the base at ~0.7 V, so I_B = (3.3 − 0.7)/10 k − 0.7/47 k = 260 − 15 = 245 µA. h_FE ≥ 100 gives 24 mA against a 15 mA load.</text>
  <text class="step" x="40" y="1036">     10 k for R2 also works (I_B = 190 µA, 19 mA) but the margin is thin. Do not go below 10 k: R1/R2 then starve the base.</text>
  <text class="step" x="40" y="1064">5.  The piezo is POLARISED: + to the 3.3 V rail, − to the collector. Backwards = silent, or damaged.</text>
  <text class="step" x="40" y="1092">6.  Volume: ~3.1 V is the very bottom of its 3–24 V range — expect it markedly quieter than at 12 V. Same circuit off the 5 V USB rail if you need more.</text>
  <text class="step" x="40" y="1120">7.  No coil = no heating. The 10 ms strike ladder, the 1 s on-time limit and the 10 s cooldown all stop applying — a strike is now a tone burst.</text>
  <text class="step" x="40" y="1148">8.  The 12 V version's MOSFET parts (gate pull-up, gate series resistor) stay deleted. The R2 here is a different part in a different place: base to GND.</text>
  <text class="stepr" x="40" y="1176">9.  A SOLID tone is a different defect and R2 cannot help: the pin is being DRIVEN high. That is the strike's off-event never arriving,</text>
  <text class="stepr" x="40" y="1204">     which latches `striking` so no later boundary recovers it. Bounding the on-time must live OUTSIDE the VM event loop.</text>
</svg>
