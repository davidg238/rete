<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1270" viewBox="0 0 1660 1270">
  <style>
    .wire  { stroke:#111; stroke-width:3; fill:none; stroke-linecap:round }
    .pwr   { stroke:#b3261e; stroke-width:3.5; fill:none; stroke-linecap:round }
    .gndw  { stroke:#111; stroke-width:3.5; fill:none; stroke-linecap:round }
    .dash  { stroke:#8a94a3; stroke-width:2.5; fill:none; stroke-dasharray:8 7 }
    .box   { fill:#fff; stroke:#111; stroke-width:3 }
    .panel { fill:#f5f7fa; stroke:#c3ccd8; stroke-width:2 }
    .pad   { fill:#111; stroke:none }
    .padr  { fill:#b3261e; stroke:none }
    .padg  { fill:#8a94a3; stroke:none }
    .lbl   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; fill:#111 }
    .pin   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#111 }
    .pinr  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#b3261e }
    .ping  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:20px; font-weight:bold; fill:#8a94a3 }
    .hdr   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:17px; fill:#5a6472 }
    .sig   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; font-weight:bold; fill:#1a4f8a }
    .note  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#1a4f8a }
    .warn  { font-family:'DejaVu Sans',Arial,sans-serif; font-size:18px; font-style:italic; fill:#b3261e }
    .title { font-family:'DejaVu Sans',Arial,sans-serif; font-size:28px; font-weight:bold; fill:#111 }
    .sub   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:19px; fill:#444 }
    .bhd   { font-family:'DejaVu Sans',Arial,sans-serif; font-size:21px; font-weight:bold; fill:#111 }
    .mono  { font-family:'DejaVu Sans Mono',monospace; font-size:16px; fill:#111 }
    .monob { font-family:'DejaVu Sans Mono',monospace; font-size:16px; font-weight:bold; fill:#111 }
  </style>

  <rect x="0" y="0" width="1660" height="1270" fill="#ffffff"/>

  <text class="title" x="40" y="46">Waveshare 2.13" e-Paper HAT  →  a dedicated ESP32-C6-DevKitC-1</text>
  <text class="sub"   x="40" y="76">Nothing else on this board, so the SPI lands on the C6's STOCK spi2 pins — the wiring needs no custom pinmux at all.</text>
  <text class="sub"   x="40" y="104">Use the 8-pin header, not the 40-pin RPi one. 3.3 V logic, write-only, 4 MHz.</text>

  <!-- ================= C6 board ================= -->
  <rect class="box" x="90" y="180" width="330" height="600" rx="10"/>
  <text class="bhd" x="112" y="215">ESP32-C6-DevKitC-1</text>
  <line class="wire" x1="90" y1="228" x2="420" y2="228" stroke-width="2"/>

  <text class="hdr" x="112" y="278">J3</text>
  <text class="pin" x="404" y="278" text-anchor="end">GPIO23</text>
  <circle class="pad" cx="420" cy="272" r="7"/>
  <text class="hdr" x="112" y="338">J3</text>
  <text class="pin" x="404" y="338" text-anchor="end">GPIO22</text>
  <circle class="pad" cx="420" cy="332" r="7"/>
  <text class="hdr" x="112" y="398">J3</text>
  <text class="pin" x="404" y="398" text-anchor="end">GPIO21</text>
  <circle class="pad" cx="420" cy="392" r="7"/>
  <text class="hdr" x="112" y="458">J1</text>
  <text class="pin" x="404" y="458" text-anchor="end">GPIO10</text>
  <circle class="pad" cx="420" cy="452" r="7"/>
  <text class="hdr" x="112" y="518">J1</text>
  <text class="pin" x="404" y="518" text-anchor="end">GPIO6</text>
  <circle class="pad" cx="420" cy="512" r="7"/>
  <text class="hdr" x="112" y="578">J1</text>
  <text class="pin" x="404" y="578" text-anchor="end">GPIO7</text>
  <circle class="pad" cx="420" cy="572" r="7"/>
  <text class="hdr" x="112" y="638">J3</text>
  <text class="ping" x="404" y="638" text-anchor="end">GPIO2</text>
  <circle class="padg" cx="420" cy="632" r="7"/>
  <text class="hdr" x="112" y="698">J1/J3</text>
  <text class="pin" x="404" y="698" text-anchor="end">GND</text>
  <circle class="pad" cx="420" cy="692" r="7"/>
  <text class="hdr" x="112" y="758">J1 pin 1</text>
  <text class="pinr" x="404" y="758" text-anchor="end">3V3</text>
  <circle class="padr" cx="420" cy="752" r="7"/>

  <!-- ================= module ================= -->
  <rect class="box" x="1180" y="180" width="330" height="600" rx="10"/>
  <text class="bhd" x="1202" y="215">2.13" e-Paper HAT</text>
  <line class="wire" x1="1180" y1="228" x2="1510" y2="228" stroke-width="2"/>

  <circle class="pad" cx="1180" cy="272" r="7"/>
  <text class="pin" x="1198" y="278">BUSY</text>
  <circle class="pad" cx="1180" cy="332" r="7"/>
  <text class="pin" x="1198" y="338">RST</text>
  <circle class="pad" cx="1180" cy="392" r="7"/>
  <text class="pin" x="1198" y="398">DC</text>
  <circle class="pad" cx="1180" cy="452" r="7"/>
  <text class="pin" x="1198" y="458">CS</text>
  <circle class="pad" cx="1180" cy="512" r="7"/>
  <text class="pin" x="1198" y="518">CLK</text>
  <circle class="pad" cx="1180" cy="572" r="7"/>
  <text class="pin" x="1198" y="578">DIN</text>
  <text class="hdr" x="1198" y="638">(no MISO pad)</text>
  <circle class="pad" cx="1180" cy="692" r="7"/>
  <text class="pin" x="1198" y="698">GND</text>
  <circle class="padr" cx="1180" cy="752" r="7"/>
  <text class="pinr" x="1198" y="758">VCC</text>

  <!-- ================= wires ================= -->
  <line class="wire" x1="420" y1="272" x2="1180" y2="272"/>
  <line class="wire" x1="420" y1="332" x2="1180" y2="332"/>
  <line class="wire" x1="420" y1="392" x2="1180" y2="392"/>
  <line class="wire" x1="420" y1="452" x2="1180" y2="452"/>
  <line class="wire" x1="420" y1="512" x2="1180" y2="512"/>
  <line class="wire" x1="420" y1="572" x2="1180" y2="572"/>
  <line class="dash" x1="420" y1="632" x2="1140" y2="632"/>
  <line class="gndw" x1="420" y1="692" x2="1180" y2="692"/>
  <line class="pwr"  x1="420" y1="752" x2="1180" y2="752"/>

  <text class="sig"  x="800" y="264" text-anchor="middle">BUSY</text>
  <text class="hdr"  x="800" y="298" text-anchor="middle">busy-gpios — ACTIVE_HIGH on every 2.13" mono variant</text>
  <text class="sig"  x="800" y="324" text-anchor="middle">RESET</text>
  <text class="hdr"  x="800" y="358" text-anchor="middle">reset-gpios, GPIO_ACTIVE_LOW</text>
  <text class="sig"  x="800" y="384" text-anchor="middle">D/C</text>
  <text class="hdr"  x="800" y="418" text-anchor="middle">dc-gpios, GPIO_ACTIVE_HIGH</text>
  <text class="sig"  x="800" y="444" text-anchor="middle">CS</text>
  <text class="hdr"  x="800" y="478" text-anchor="middle">cs-gpios — plain GPIO, so drop CSEL from pinctrl</text>
  <text class="sig"  x="800" y="504" text-anchor="middle">SCLK</text>
  <text class="hdr"  x="800" y="538" text-anchor="middle">stock SPIM2_SCLK_GPIO6</text>
  <text class="sig"  x="800" y="564" text-anchor="middle">MOSI</text>
  <text class="hdr"  x="800" y="598" text-anchor="middle">stock SPIM2_MOSI_GPIO7</text>
  <text class="hdr"  x="800" y="616" text-anchor="middle">MISO stays mapped in pinctrl but is not wired —</text>
  <text class="hdr"  x="800" y="660" text-anchor="middle">the panel is write-only. 0/1/3 remain free LP GPIO.</text>
  <text class="sig"  x="800" y="684" text-anchor="middle">GND</text>
  <text class="sig"  x="800" y="744" text-anchor="middle" fill="#b3261e">+3.3 V</text>
  <text class="hdr"  x="800" y="778" text-anchor="middle">not 5 V</text>

  <!-- ================= bottom panels ================= -->
  <rect class="panel" x="90" y="840" width="800" height="370" rx="8"/>
  <text class="bhd"  x="112" y="876">Which revision do you have? All three are SSD16xx.</text>
  <text class="monob" xml:space="preserve" x="112" y="912">rev   Zephyr compatible                        px        </text>
  <text class="mono"  xml:space="preserve" x="112" y="938">V1    "gooddisplay,gdeh0213b1", "solomon,ssd1673"   250x120</text>
  <text class="mono"  xml:space="preserve" x="112" y="962">V2    "gooddisplay,gdeh0213b72","solomon,ssd1675a"  250x120</text>
  <text class="mono"  xml:space="preserve" x="112" y="986">V3/V4 "gooddisplay,gdey0213b74","solomon,ssd1680"   250x122</text>
  <text class="lbl"  x="112" y="1024">Zephyr already ships all three as boards/shields/waveshare_epaper —</text>
  <text class="lbl"  x="112" y="1048">copy the overlay body and repoint dc/reset/busy at the pins above.</text>
  <text class="lbl"  x="112" y="1082">Every one declares busy-gpios ACTIVE_HIGH, so the polarity question</text>
  <text class="lbl"  x="112" y="1106">from yesterday is closed for the mono panel: SSD16XX BUSY is active high.</text>
  <text class="warn" x="112" y="1144">Only the 250x122 geometry distinguishes V3/V4. If the panel is the</text>
  <text class="warn" x="112" y="1168">3-colour (B)/(C), it is UC8151/JD79653, BUSY ACTIVE_LOW, and none</text>
  <text class="warn" x="112" y="1192">of these three overlays apply.</text>

  <rect class="panel" x="930" y="840" width="640" height="370" rx="8"/>
  <text class="bhd"  x="952" y="876">The one edit that is not optional</text>
  <text class="warn" x="952" y="912">&amp;i2c0 must be disabled.</text>
  <text class="lbl"  x="952" y="944">The C6 board DTS sets i2c0 status=okay on GPIO6/7 —</text>
  <text class="lbl"  x="952" y="968">the same two pins spim2_default uses for SCLK/MOSI.</text>
  <text class="lbl"  x="952" y="992">Both drivers program the same pin registers at the same</text>
  <text class="lbl"  x="952" y="1016">init priority, so which wins is decided by device-dependency</text>
  <text class="lbl"  x="952" y="1040">ordering, not by anything you can read in your overlay.</text>
  <text class="lbl"  x="952" y="1064">display_write still returns rc=0 onto a blank panel.</text>
  <text class="lbl"  x="952" y="1096">This is the identical trap the MagTag overlay documents at</text>
  <text class="lbl"  x="952" y="1120">its foot (GPIO8, i2c0 vs CS). Nothing needs I2C on a</text>
  <text class="lbl"  x="952" y="1144">dedicated e-paper node, so disable it outright.</text>
  <text class="note" x="952" y="1182">If your board is the universal Driver HAT, set its interface</text>
  <text class="note" x="952" y="1204">jumper to 4-wire SPI — Zephyr drives DC as a separate line.</text>
</svg>
