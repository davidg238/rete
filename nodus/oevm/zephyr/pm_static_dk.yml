# Static partition layout for the nRF52840 DK profile (run.sh --board nrf52840dk), which
# ttgm's ACC01 and OCM.1 also build on (rete#449). Passed as -DPM_STATIC_YML_FILE by run.sh.
#
# WHY: rete#310's two program slots, the C6's mechanism, in internal flash. Under the NCS
# partition manager the slots are PM partitions, not devicetree ones; flash_map_pm.h maps
# FIXED_PARTITION_EXISTS/ID/OFFSET/SIZE onto them, so runner.c and ota_zephyr.c read this
# file through the same macros the C6 reads its overlay through.
#
# Layout: app 0x0-0x80000 (512 KB; the OCM.1 debug image is ~427 KB, the DK Thread image
# ~437 KB), then two equal slots splitting the rest (252 KB each; AccMotionBle.oimg is
# ~160 KB), then settings_storage where dynamic PM put it (0xfe000, 8 KB). The equal split
# is the degenerate case: a measured app or program size is what would move the line.
program_a:
  address: 0x80000
  end_address: 0xbf000
  region: flash_primary
  size: 0x3f000
program_b:
  address: 0xbf000
  end_address: 0xfe000
  region: flash_primary
  size: 0x3f000
settings_storage:
  address: 0xfe000
  end_address: 0x100000
  region: flash_primary
  size: 0x2000
# rete#443: the outbox journal (src/backend/zephyr/journal_zephyr.c, FCB) on the board's
# SPI NOR, for OCM.1 and ACC01: their overlays (in ~/workspace/ocm and ~/workspace/ttgm)
# choose `nordic,pm-ext-flash = &nor`, which is what creates the external_flash region.
# Under the partition manager a devicetree partition is invisible to FIXED_PARTITION_*
# (flash_map_pm.h), so the partition is declared here. A build with no such chosen node
# (the bare DK) has no external_flash region, PM leaves this entry out, and the firmware
# answers journalOpen false. 255 x 4 KB = 1020 KB (FCB's sector count is a uint8_t; 4 KB
# erases need CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096 in the board conf).
outbox:
  address: 0x0
  end_address: 0xff000
  region: external_flash
  device: DT_CHOSEN(nordic_pm_ext_flash)
  size: 0xff000
