# rpi_pico2 node console on the RP2350's OWN USB — a --conf-extra fragment, paired
# with usb-console.overlay (EXTRA_DTC_OVERLAY_FILE). Written 2026-09-21 for rete#302
# on a Waveshare RP2350-Zero with no adapter yet soldered to GP0/GP1.
#
# prj_rpi_pico2.conf keeps uart0 as the console and says why (the adapter survives
# the board's resets, so a collector keeps one handle; this console re-enumerates on
# every reset and loses the first seconds of each boot). This fragment is for a
# bench read where a human opens the port after enumeration: TimerNode ticks and
# the Hanoi runs print every few seconds, so a lost banner costs nothing. NOT for a
# collector, NOT for cabot (the Pi reads the UART, M27).
#
# The block is prj_dongle_thread.conf's, verbatim, minus RESET_ON_FATAL_ERROR (an
# NCS symbol; upstream aborts on it). CDC_ACM_SERIAL_INITIALIZE_AT_BOOT is the
# load-bearing line. Read the port with pyserial dtr=True, not `cat`.
#
#   EXTRA_DTC_OVERLAY_FILE=$PWD/usb-console.overlay \
#     ./run.sh --board rpi_pico2 --conf-extra prj_rpi_pico2_usb.conf --node X.nsl --flash
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

# THE USB STACK MUST NOT LOG INTO ITS OWN CONSOLE. prj_rpi_pico2.conf turns
# CONFIG_LOG on (minimal mode) so driver faults are legible, and under it
# usbd_ch9.c:1158 logs "Handle control ..." at INFO on EVERY control transfer, from
# the usbd thread — into the console, which is the CDC port still being enumerated.
# Measured 2026-09-21: the board answered its device descriptor and never its
# configuration descriptor, `-71` every ~8 s forever, while the LOG-less layoutdump
# enumerated on the same block. Three loggers off; every other driver keeps LOG.
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
