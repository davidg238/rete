# oevm/zephyr — ESP32-S2 (MagTag) as a porta node: the WiFi overlay, cut to what a
# bridge needs. rete#379.
#
# Layered AFTER prj_esp32s2_wifi.conf (later fragments win):
#   OEVM_IRAM_HOT=0 VM_STACK_INIT_WORDS=2048 OEVM_HEAP_SIZE=32768 OEVM_DEBUG_HOOKS=1 \
#   ./run.sh --board esp32s2 --conf-extra "prj_esp32s2_wifi.conf;prj_esp32s2_porta.conf" ...
# OEVM_IRAM_HOT=0 keeps the interpreter's hot path in flash (8 KB of IRAM, which on
# this part is 8 KB of dram0); VM_STACK_INIT_WORDS=2048 is the 8 KB VM stack the host
# floor below was measured with (the board default is 4096 words, 16 KB, inside the
# arena). Measured 2026-10-09 with this fragment: a 16 KB arena linked with 19.3 KB
# of dram0 to spare, so the link ceiling is ~35 KB; 32 KB links with 2.3 KB spare.
# The next lever, if 32 KB proves tight on the board, is the k_malloc pool: the WiFi
# adapter's 40 KB add-size is a Kconfig FLOOR on the pool (HEAP_MEM_POOL_SIZE below is
# honoured only above it), lifted by CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y — a runtime
# risk (adapter allocation failures), so it waits for a boot that needs it.
#
# THE BUDGET. The S2's instruction and data RAM are one 288 KB pool: every byte of
# code placed in IRAM is shadowed out of dram0_0_seg (.dram0.dummy in the map). With
# the WiFi overlay as it stood, a 64 KB arena overflowed that segment by 45 KB, and a
# 16 KB arena linked with 4 KB to spare — against a measured floor of 24 KB for the
# kernel + bridge + debugger (SleepyDebugNode, 32-bit host build, leg A of
# tests/sleepy_debug_host.sh: stop, backtrace, step, continue, 93 collections).
# Every line below buys arena, and each is a measured or Kconfig-stated amount, not
# a guess; PSRAM (the other way out) hangs the boot (tuvm#96, closed out of service).

# k_malloc pool: 24 KB was sized for the display + DAC clock; a bridge node has no
# k_malloc caller of its own. The WiFi adapter adds its own 40 KB on top (Kconfig
# HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI, not settable here), so this is the only part the
# app owns.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# WiFi buffers: the defaults are sized for throughput (10 static RX x 1.6 KB, 32
# dynamic each way, AMPDU windows). A bridge exchanges two datagrams a wake.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
# (SOFTAP_SUPPORT has no prompt — it follows WIFI_AP_SUPPORT, which is not set here.)

# No NTP on this node (the clock is porta's), so no resolver either: the DNS message
# pools and the SNTP context go.
CONFIG_SNTP=n
CONFIG_DNS_RESOLVER=n

# No panel, no speaker on this node: the uc81xx and DAC drivers stay out. (The bell
# demo, rete#379's end, will need them back and will have to find the RAM.)
CONFIG_DISPLAY=n
CONFIG_DAC=n
CONFIG_SPI=n
