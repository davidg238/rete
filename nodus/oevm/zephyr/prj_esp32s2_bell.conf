# oevm/zephyr — ESP32-S2 (MagTag) as the ship's-bell clock AND a porta node: the panel,
# the speaker and SNTP put back after prj_esp32s2_porta.conf took them out. rete#380.
#
# Layered LAST (later fragments win):
#   OEVM_IRAM_HOT=0 VM_STACK_INIT_WORDS=2048 OEVM_HEAP_SIZE=36864 \
#   METHOD_CACHE_SIZE=128 SERIAL_FIFO_CAP=256 \
#   OEVM_DEBUG_HOOKS=1 OEVM_METHOD_PROFILE=1 OEVM_NTP_SERVER6=<IPv6 literal> \
#   ./run.sh --board esp32s2 --model B --node MagTagDeepSleepNode.nsl \
#     --conf-extra "prj_esp32s2_wifi.conf;prj_esp32s2_porta.conf;prj_esp32s2_bell.conf" --flash
#
# THE BUDGET IS THE PORTA FRAGMENT'S (read its header): one 288 KB pool for code and
# data, and a 32 KB arena that linked with 2.3 KB of dram0 to spare WITHOUT these three
# drivers. MEASURED 2026-10-09, first link of this fragment at a 32 KB arena, profiler on:
# dram0_0_seg overflowed by 5,168 B. The map named the two numbers that matter:
#   - the k_malloc pool resolved to 45,056 B however HEAP_MEM_POOL_SIZE was set, because
#     the WiFi adapter's HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI (40,960) is a Kconfig FLOOR that
#     the kernel rounds the pool UP to (kernel/Kconfig HEAP_MEM_POOL_SIZE help);
#   - the profiler's four tables (vm.c g_mprof_*, OEVM_MPROF_SLOTS=256) are 6,144 B — the
#     C6's +6,176 (#312) seen again. They stay: this is the profile image.
# So the lever is the floor itself. IGNORE_MIN lets the pool be what THIS build needs: the
# e-paper framebuffer (CFB k_mallocs 296 * 128 / 8 = 4,736 B, subsys/fb/cfb.c) plus the
# adapter's real allocations, which the 40 KB estimate sizes for the DEFAULT buffer counts
# the porta fragment has already cut (static RX 4, dynamic 8/8, no AMPDU).
# MEASURED ON THE BOARD 2026-10-09 (boot 1 of this fragment): at 24 KB the adapter came up
# and associated, and `DISPLAY cfb init failed` — the framebuffer's k_malloc was what did
# not fit, so the adapter alone takes between 19.5 and 24 KB here. 32 KB is that worst
# case plus the framebuffer plus ~3 KB of allocator slack; paid for in dram0 by the loopback
# serial fifo (SERIAL_FIFO_CAP=256, was 4 KB and unused), a 128-entry method cache (-2 KB)
# and a 36 KB arena (-4 KB) — see the recipe above. The WiFi bring-up line is still the
# first thing to read on a boot: "too small" shows up as the adapter's k_malloc failing.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
# The e-paper. CONFIG_UC81XX follows the IL0373 devicetree node and selects MIPI_DBI.
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# The DAC bell on GPIO17 (SPEAKER): the cosine generator is reached through the legacy
# driver header that CONFIG_DAC_ESP32 compiles in — prj_esp32s2.conf's note.
CONFIG_DAC=y
CONFIG_DAC_ESP32=y
# SNTP, by LITERAL address only: OEVM_NTP_SERVER6 at CMake configure time (main.c), as the
# C6 bell does it. No resolver — the DNS message pools stay out, and the porta mesh has no
# DNS64 anyway. Without the literal main.c falls back to sntp_simple("pool.ntp.org"), which
# answers rc=-2 forever and reads exactly like a network outage (ShipsBellNodeC6.nsl's
# header): read the printk — `sntp_simple_addr(` means the address was compiled in.
CONFIG_SNTP=y
