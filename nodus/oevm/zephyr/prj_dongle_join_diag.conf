# DIAGNOSTIC OVERLAY — "the node runs but never attaches" (rete#281, 2026-08-30).
# Stack as a 3rd conf; REMOVE after, like prj_dongle_diag.conf which it extends.
#
# THE TREATMENT: OpenThread selects SETTINGS->NVS on this board, and a PERSISTED
# dataset OVERRIDES the Kconfig seed. So an image carrying the correct credentials
# still joins whatever network the last image wrote into settings_storage — and this
# dongle has carried several, including rung-7/8 images that predate the gitignored
# real-dataset overlay and therefore persisted prj_dongle_thread.conf's PLACEHOLDER
# network (PAN 0xabcd, channel 11, "ot_zephyr"). SETTINGS_RAM makes OT forget on every
# boot and use the image's own dataset, which is the one verified against the live
# mesh (channel 14, PAN 0x437, OpenThread-0437).
#
# It is a DISCRIMINATOR, not a fix: attaching with this overlay proves the persisted
# dataset was the cause and the answer is to erase settings_storage, not to ship
# without persistence.
CONFIG_OPENTHREAD_SETTINGS_RAM=y

# THE INSTRUMENT: the dongle build has CONFIG_LOG=n, so an ARM fault — and every
# OpenThread complaint — dies silently. Minimal mode prints synchronously via printk.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_ASSERT=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# THE SHELL, added after three hypotheses each cost a flash (stale NVS dataset —
# refuted, SETTINGS_RAM applied and it still did not attach; wrong credentials —
# refuted against the live dataset; wrong gateway address — refuted, it is live on
# the gateway). Every one of those was a guess priced at a board cycle, and
# `ot state` / `ot dataset active` / `ot scan` answer all three classes directly.
#
# The dongle's DTS already routes zephyr,shell-uart to the same cdc-acm console, so
# this costs no wiring — the shell shares the port with the VM's tick output.
#
# thread_bringup.c's own header is why the SCAN matters most: on the C6 this exact
# symptom — role stuck DETACHED with a provably correct dataset — was a RADIO DRIVER
# bug (stop() mapped onto a full teardown), not a configuration one. A scan that sees
# the network proves the radio hears; a scan that sees nothing moves the search to the
# driver rather than to another credential.
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
