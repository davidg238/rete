# oevm/zephyr — ESP32-S2 (MagTag) WiFi + SNTP overlay. tuvm#94.
#
# Layered on prj_esp32s2.conf, and normally on prj_esp32s2_psram.conf too:
#   bash zephyr/run.sh --board esp32s2 \
#        --conf-extra "prj_esp32s2_psram.conf;prj_esp32s2_wifi.conf" ...
#
# Credentials come from the GIT-IGNORED prj_esp32_wifi.local.conf (the same file
# the WROOM-32 uses — CONFIG_OEVM_WIFI_SSID / _PSK are board-agnostic).
#
# THE BASE CONFIG IS IPv6 AND THIS OVERLAY DOES NOT UNDO THAT. prj_esp32s2.conf
# picks IPv6 because udp_zephyr.c binds AF_INET6, and #72 established that a
# WiFi/IPv4 node needs dual-stack in BOTH directions. The mapping Kconfig below is
# the inbound half; it is not optional decoration. Without it the bind succeeds and
# IPv4 datagrams are silently never delivered — no error anywhere.
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4_MAPPING_TO_IPV6=y

# WiFi driver + the wifi_mgmt / net_mgmt request API that main.c's board-agnostic
# wifi_bringup() already drives. #85 proved this whole chain works on the S2 with
# ZERO new code; the only cost was RAM.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y

# THE WHOLE REASON PSRAM IS IN PLAY. HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI is
# 40960 if ESP_WIFI_HEAP_SYSTEM but 19456 if ESP_WIFI_HEAP_SPIRAM
# (drivers/wifi/esp32/Kconfig.esp32:24-27) — a 21,504 B dram0 reclaim, moving the
# adapter heap to smh_malloc out of the SHARED_MULTI_HEAP region. It sits inside
# `if WIFI_ESP32`, which is why it lives here and not in the PSRAM overlay.
#
# NOTE THIS IS ONLY HALF THE GAP. Back-computed from #85's MEASURED overflow
# rather than from the heap figure alone, WiFi's full static cost on this part is
# ~73 KB against ~31 KB free in a display+DAC build. The arena has to come down
# too — see OEVM_HEAP_SIZE on the run.sh command line, not a Kconfig.
#
# COMMENTED OUT, AND IT MUST STAY THAT WAY UNTIL PSRAM BOOTS. This selects
# smh_malloc out of the SHARED_MULTI_HEAP region — which only exists if
# CONFIG_ESP_SPIRAM is on AND the board actually reaches the kernel with it on.
# As of 2026-07-23 it does not: PSRAM initialises and passes its memtest, then
# the boot stops dead before Zephyr starts (tuvm#96). Selecting a heap whose
# backing region never came up would be strictly worse than the default.
# Re-enable together with prj_esp32s2_psram.conf once #96 is fixed.
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# SNTP for the bells. sntp_simple() does init/query/close in one call
# (include/zephyr/net/sntp.h:161), so the node needs no NTP state machine.
# DNS_RESOLVER is what lets a POOL HOSTNAME be used; without it the server must be
# a literal IP, and NTP pool addresses are not stable enough to hardcode.
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y

# tuvm#94 stage 5 (deep-sleep clock): CONFIG_POWEROFF pulls the espressif HAL's
# sleep_gpio.c + sleep_event.c into the build. Those DEFINE esp_sleep_isolate_
# digital_gpio / esp_sleep_execute_event_callbacks, which the unconditionally-
# compiled sleep_modes.c references — without POWEROFF the deep_sleep_target leaf
# (main.c) fails to LINK (undefined refs), verified at build 2026-07-24. The leaf
# still calls the HAL directly (esp_sleep_enable_timer_wakeup + esp_deep_sleep_
# start) rather than z_sys_poweroff(), because Zephyr's poweroff.c arms no wake
# source (#83); POWEROFF is enabled only to compile the supporting sleep files.
# (2026-07-24: enabling this crashed the boot handoff — root cause was the loader.c
# RTC-segment walk bug, fixed in the zephyr tree; see deep_sleep_target in sleep_zephyr.c.)
CONFIG_POWEROFF=y

# DO NOT add CONFIG_POSIX_API here. prj_esp32.conf's WiFi block records why: it
# exports a bare send() that collides with oevm's own send() dispatch function in
# dispatch.c. (An earlier draft of this file also carried
# CONFIG_NET_SOCKETS_POSIX_NAMES=n as belt-and-braces — that symbol does not exist
# in this Zephyr and assigning it is a hard Kconfig error, not a warning.)
