# OpenThread / IPv6 radio layer for the C6, applied on top of prj_esp32c6.conf
# via EXTRA_CONF_FILE.
#
# Thread rather than WiFi: esp32c6_devkitc_hpcore.yaml declares netif:openthread
# in its supported: list and does NOT declare wifi. Thread is also IPv6-only,
# which prj_esp32c6.conf already matches, so this layer adds a radio and nothing
# else.
#
# Values are the networking block of zephyr/prj_dk_thread.conf (proven on the
# nRF52840 DK). That file's CONFIG_NEWLIB_LIBC and CONFIG_FPU=y are deliberately
# NOT copied: the C6 uses picolibc and has no FPU (rv32imac_zicsr).
#
# Requires boards/esp32c6_devkitc_esp32c6_hpcore.overlay to enable the
# ieee802154 node — the driver does not build otherwise.
CONFIG_IEEE802154=y
CONFIG_IEEE802154_ESP32=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6240

# The four PKT/BUF pool sizes below are byte-identical to prj_esp32c6.conf's
# radio-less values (that file's lines 70-73) — this layer does not actually
# raise them. CONFIG_NET_MAX_CONTEXTS is the only value here that is genuinely
# this layer's own (Thread's context needs), not inherited from the no-radio
# default; it happens to land on the same number (6).
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# SNTP, so the bell can correct its RTC against the mesh (tuvm#94 stage 4, on
# Thread as of 2026-08-01). This is what clock_zephyr.c's ntp_target_sync is now gated
# on — CONFIG_WIFI was the wrong dependency and left this board with the -1 stub
# despite having a perfectly good IPv6 network.
#
# CONFIG_DNS_RESOLVER is deliberately NOT enabled: the node is pointed at a literal
# IPv6 address via OEVM_NTP_SERVER6, because the porta OMR prefix is a ULA with no
# global IPv6 and no DNS64 — there is nothing for a hostname to resolve against.
CONFIG_SNTP=y

# Thread stores its network credentials in settings; prj_esp32c6.conf carries the NVS backend.

# --- Thread dataset SEED (first-boot defaults; the persisted NVS copy wins after) ---
# SECRET REDACTED: the real porta dataset (incl. network key) is NOT committed. It
# lives in the gitignored prj_esp32c6_thread.local.conf, auto-layered by run.sh, whose
# values OVERRIDE these placeholders. Read the live dataset:
#   ssh gw85224-01 docker exec otbr ot-ctl dataset active
# Without the overlay the node builds but will NOT join the porta mesh.
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_CHANNEL=11
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"
CONFIG_OPENTHREAD_NETWORK_NAME="ot_zephyr"
