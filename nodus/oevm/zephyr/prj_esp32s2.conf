# oevm/zephyr — ESP32-S2 (Adafruit MagTag, ESP32-S2-WROVER) boot-&-run Kconfig.
#
# Selected with:
#   bash zephyr/run.sh --board esp32s2 ...
# built against the upstream-Zephyr workspace ~/zephyr-esp32 (NOT NCS).
#
# BOARD TARGET IS esp32s2_saola/esp32s2, NOT a MagTag board. There is no MagTag
# board in Zephyr, and none is needed to boot: esp32s2_saola.dts:9 includes
# <espressif/esp32s2/esp32s2_wrover_n4r2.dtsi>, which IS the MagTag's module —
# ESP32-S2-WROVER, 4 MB flash, 2 MB PSRAM. Everything that differs between the
# Saola and the MagTag is board IO (buttons, NeoPixels, the IL0373 e-paper),
# none of which this config touches. Those arrive later as a devicetree overlay
# named for the board target's qualifiers — boards/esp32s2_saola_esp32s2.overlay
# (the filename is load-bearing; see the esp32_devkitc overlay's header).
#
# Four deliberate differences from prj_esp32.conf (the WROOM-32 config), each
# load-bearing:
#
# 1. NO CONFIG_FPU. The ESP32-S2's Xtensa LX7 core has NO FPU — verified in the
#    SoC Kconfigs: soc/espressif/esp32/Kconfig:12 and esp32s3/Kconfig:11 both
#    `select CPU_HAS_FPU`, and soc/espressif/esp32s2/Kconfig does not. Every VM
#    float becomes a soft-float libcall. Same situation as the C6 and accepted
#    for the same reason: this target is chosen for RAM and for its display,
#    not for float throughput. Do NOT copy a float benchmark number off this
#    board into the STIC table without saying soft-float on the row.
#
# 2. NO CONFIG_ESP32_USE_UNSUPPORTED_REVISION. That opt-in exists for the bench
#    WROOM-32's rev-1.0 Xtensa silicon; it is meaningless on the S2.
#
# 3. NO WiFi. The S2 has a WiFi radio (and NOTHING else — no BT, no 802.15.4;
#    it appears in neither drivers/bluetooth nor drivers/ieee802154), so this
#    board can never join the porta/Thread mesh. Bringing WiFi up here is not a
#    Kconfig line away either: src/backend/zephyr/udp_zephyr.c is AF_INET6-only,
#    so a WiFi/IPv4 node needs dual-stack in BOTH directions — see oevm #72.
#    Out of scope for the boot gate.
#
# 4. The ROM ld patch DOES apply (unlike the C6). esp32s2.rom.newlib-funcs.ld
#    strong-assigns fflush (:15), longjmp (:31) and setjmp (:41) to ROM
#    addresses, the same forced-ROM-newlib family that faults
#    vm_protected_fire() on every nsl reaction fire on the WROOM-32. run.sh's
#    esp32s2 profile sets ROM_PATCH=1 and passes --chip esp32s2. Note the S2
#    list is setjmp/longjmp only — ungetc is NOT forced on this part, which is
#    why tools/patch-esp32-rom-ld.sh carries per-chip symbol sets. fflush needs
#    no patch: platform_console_flush() is already a no-op on Zephyr.
#
# Console: the board DTS routes zephyr,console = &uart0, whose pinctrl is
# UART0_TX_GPIO43 / UART0_RX_GPIO44 (esp32s2_saola-pinctrl.dtsi:13-22). On the
# MagTag those two pins ARE the soldered "UART Debug" header, so the console
# lands there with no overlay. That header breaks out TX/RX ONLY — no DTR/RTS —
# which has two consequences worth knowing:
#   - Opening the port CANNOT reset the board. The "any open of the port reboots
#     it" failure mode that costs boot banners on the other ESP32s is physically
#     impossible here, so a console handle can be held across flashes.
#   - esptool cannot auto-reset into download mode over this header either.
#     Flash via the native USB port, or hold BOOT while pressing RESET.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc: picolibc, matching the ESP32 and C6 configs. The VM needs
# malloc/realloc/free, setjmp, snprintf and FP printf. The VM's own arena is the
# static oevm_heap_store (gc.c:25), sized by OEVM_HEAP_SIZE at build time.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# tuvm#88 — raised from 16384 for the e-paper display seam. CFB k_mallocs its
# framebuffer (subsys/fb/cfb.c:687): 296 * 128 / 8 = 4736 B. 24576 leaves
# generous slack for the allocator header and anything else on the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=8192

# Net stack WITHOUT a radio driver.
#
# NOT optional, despite this target having no network peer to talk to:
# zephyr/CMakeLists.txt adds src/udp.c, src/http.c, src/http_core.c and their
# zephyr backends to target_sources UNCONDITIONALLY, because dispatch.c's send()
# fast path probes `receiver == udp_object()` on every send. Without
# CONFIG_NET_SOCKETS the app fails to link on zsock_* undefined references.
# The same reasoning is recorded in prj_esp32.conf and prj_esp32c6.conf.
#
# IPv6 rather than IPv4, matching the C6 base config — udp_zephyr.c is
# AF_INET6-only, so an IPv6 base is the one that agrees with the backend as
# written. This is NOT a bet on this board's eventual radio: its radio is WiFi,
# and WiFi means IPv4, which means the oevm #72 dual-stack work. Keeping the
# base IPv6 just avoids pretending that work is already done.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n

# Small pools: this config has no radio, so nothing but the loopback path uses
# them.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# tuvm#88 — the e-paper display seam. CONFIG_UC81XX is selected automatically by
# the IL0373 devicetree node (Kconfig.uc81xx depends on DT_HAS_ULTRACHIP_IL0373_
# ENABLED), and it in turn selects MIPI_DBI.
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# tuvm#94 — the DAC bell. GPIO17 (SPEAKER) is DAC_1, the same pin the #86 LEDC
# chime used. CONFIG_DAC_ESP32 is what makes the cosine generator reachable:
# hal/espressif/zephyr/esp32s2/CMakeLists.txt:209-215 compiles
# components/driver/deprecated/dac_common_legacy.c under it, and that file is
# where dac_cw_generator_config/enable live. Zephyr's own DAC API cannot reach
# them — drivers/dac/dac_esp32.c exposes only channel_setup + write_value (one
# 8-bit DC level per call, no buffer, no DMA), so the tone is driven through the
# legacy header while the pin is enabled through the Zephyr API.
#
# NOTE CONFIG_PWM IS DELIBERATELY ABSENT. It was never committed (5d7fdd8 touched
# only the overlay and main.c), so the LEDC chime is inert and its
# LEDC_CH0_GPIO17 pinctrl route is never applied. That is load-bearing: LEDC and
# the DAC both drive GPIO17, and two peripherals claiming one pin is the same
# race this board already hit with i2c0-vs-SPI-CS on GPIO8 — rc=0, silence, and
# it reads exactly like a driver fault. If PWM is ever wanted alongside the DAC,
# disable &ledc0 in the overlay first.
CONFIG_DAC=y
CONFIG_DAC_ESP32=y

# NOTE FOR THE NEXT PERSON WHO SEES A ZEPHYR ESP32 DRIVER FAIL SILENTLY: this
# build has CONFIG_PRINTK but NOT CONFIG_LOG, so every driver LOG_ERR compiles to
# nothing. Gate 1 of tuvm#94 cost a build to that: dac_esp32_init was returning
# -EIO and the only visible symptom was a device that was not ready. Adding
#   CONFIG_LOG=y / CONFIG_LOG_MODE_MINIMAL=y
# (~1 KB dram0, no backend thread, records go straight to printk) turned that into
# "E: DAC clock setup failed (-5)" on the next boot. Re-add temporarily whenever a
# driver misbehaves for no stated reason; it is not left on because nothing in the
# steady state reads it.
