# The sensor seam's 'accel' kind on Zephyr's st,lis2dh driver (rete#436): the
# LIS2DH family and the LSM303AGR accelerometer. Stacked with --conf-extra on top
# of a board's CONF_FILE; the board's devicetree overlay supplies the node and the
# `accel0` alias (run.sh --dtc-overlay, rete#438).
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
# Any-motion (sensorArm:) needs a trigger mode. The global system work queue, not
# an own thread: the handler only posts a pulse, so a dedicated stack buys nothing.
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
