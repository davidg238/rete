# oevm/zephyr/prj_dk_ble.conf — SPIKE rete#439: the nRF52840 DK reaching porta over
# Bluetooth LE to a relay on David's phone, which forwards UDP over Tailscale. Same
# board, console and storage as prj_dk_thread.conf; the radio is the only difference.
# Selected with run.sh --board nrf52840dk --conf prj_dk_ble.conf.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_GPIO=y
# reboot_note.c and ota_zephyr.c call sys_reboot; OpenThread had been selecting this.
CONFIG_REBOOT=y

# --- Net stack WITHOUT a link — the rpi_pico2 shape (prj_rpi_pico2.conf). udp.c's
# sockets go to Bluetooth (udp_ble.c, chosen by CONFIG_BT in CMakeLists.txt), but
# http_zephyr.c, log_udp.c and main.c still link zsock_*. Removing this block is the
# rest of the RAM a Bluetooth build could win; the spike measures it first.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# --- Bluetooth LE peripheral + L2CAP connection-oriented channel (udp_ble.c) -------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="oevm-dk"
CONFIG_BT_SMP=y
# Pair once (rete#439): the bond persists in settings/NVS; the app refuses a second.
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_MAX_CONN=1
# Larger link-layer packets: fewer radio events per datagram.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
