# oevm/zephyr/prj_dk_ble.conf — rete#439: the nRF52840 DK reaching porta over
# Bluetooth LE to a relay on David's phone, which forwards UDP over Tailscale. Same
# board, console and storage as prj_dk_thread.conf; the radio is the only difference.
# Selected with run.sh --board nrf52840dk --conf prj_dk_ble.conf.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_GPIO=y
# reboot_note.c and ota_zephyr.c call sys_reboot; OpenThread had been selecting this.
CONFIG_REBOOT=y

# No IP stack (rete#439 design rule 2): the datagram seam is udp_ble.c, the console tee
# goes through it (log_udp.c), and http_zephyr.c answers -1 to a listen.

# --- Bluetooth LE peripheral + L2CAP connection-oriented channel (udp_ble.c) -------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="oevm-dk"
CONFIG_BT_SMP=y
# Pair once (rete#439): the bond persists in settings/NVS; the app refuses a second.
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Just Works cannot authenticate, so the default MITM demand fails every pairing (error 9,
# measured on the ACC01 2026-10-23). LE Secure Connections stays on: BT_SMP_SC_PAIR_ONLY.
CONFIG_BT_SMP_ENFORCE_MITM=n
# Pairing's key agreement runs on the Bluetooth long workqueue (default priority 10). The
# VM thread (main, priority 0) busy-polls while it awaits porta's reply, so at 10 the work
# starved past SMP's 30 s timeout and every later pairing found it still pending (ACC01,
# 2026-10-23). At 0 it time-slices with the VM; 0 is the Kconfig floor.
CONFIG_BT_LONG_WQ_PRIO=0
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_MAX_CONN=1
# Larger link-layer packets: fewer radio events per datagram.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
