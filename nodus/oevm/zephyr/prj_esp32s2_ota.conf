# oevm/zephyr — ESP32-S2 (MagTag): the program-slot runner's manifest (rete#233 §10 T3).
#
# runner.c compiles its real half only where program_a/program_b exist AND settings do;
# the S2 overlay declares the slots, so without this fragment main.c asks the stub, which
# answers "no program" and the node idles with its console up. The manifest is a handful
# of keys under `ota/` in NVS on the 4 MB table's `storage` partition (0x3B0000, 192 KB).
# Layer AFTER prj_esp32s2_bell.conf; the Thread C6 gets the same five lines from
# prj_esp32c6_thread.conf because Thread's dataset already needed them.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# rete#233 T10: the stage runs on the VM thread (T9's named fallback, earned here): the
# first S2 link with the fetch thread overflowed dram0 by 10,992 B, and a deep-sleep node
# has nothing else to do while awake. Pair this fragment with
# OEVM_SPACE_MAX_CHANNELS=<the count the node prints at `space: N of M channels`> and
# OEVM_OTA_PUBKEY=<porta.pub> in the env — the recipe is MagTagDeepSleepNode.nsl's header.
CONFIG_OEVM_OTA_INCHANNEL=y
