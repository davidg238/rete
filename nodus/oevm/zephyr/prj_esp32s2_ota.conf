# oevm/zephyr — ESP32-S2 (MagTag): the program push staged in-channel (rete#233 §10 T10).
#
# The runner's settings backend is in prj_esp32s2.conf, as the C6's is in prj_esp32c6.conf:
# every S2 build has the slots, so every one carries it. Layer AFTER prj_esp32s2_bell.conf.
#
# The stage runs on the VM thread (T9's named fallback, earned here): the
# first S2 link with the fetch thread overflowed dram0 by 10,992 B, and a deep-sleep node
# has nothing else to do while awake. Pair this fragment with
# OEVM_SPACE_MAX_CHANNELS=<the count the node prints at `space: N of M channels`> and
# OEVM_OTA_PUBKEY=<porta.pub> in the env — the recipe is MagTagDeepSleepNode.nsl's header.
CONFIG_OEVM_OTA_INCHANNEL=y
