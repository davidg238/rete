# oevm/zephyr — Raspberry Pi Pico 2 (RP2350A, Cortex-M33) boot-&-run Kconfig.
#
# Selected with:
#   bash zephyr/run.sh --board rpi_pico2 ...
# built against the upstream-Zephyr workspace ~/zephyr-esp32 (NOT NCS) — the same
# west workspace and the same arm-zephyr-eabi SDK toolchain the nRF path uses, so
# this target adds no toolchain and no workspace (rete#301, #302).
#
# The fourth target, cut to the C6 rung's pattern (#57) minus what this part does not
# have. The board is chosen for cabot (its M28): 25+ GPIO, two SPI, three PIO blocks,
# 520 KB SRAM, a hardware FPU. It has NO radio and wants none — so unlike every other
# prj_<board>.conf here there is no Thread layer to stack on top, no dataset overlay,
# and nothing that brings a porta bridge up. The Pi is the porta one level up (#292).
#
# Console: uart0 (GP0 TX / GP1 RX, 115200), the board default — zephyr,console =
# &uart0 in rpi_pico2.dtsi. The Pico 2 has no on-board USB-UART bridge, so uart0
# rides whatever adapter is wired to those pins, and THAT is the point of choosing
# it over the SoC's USB-CDC: the adapter stays enumerated across the board's resets,
# so a collector keeps one handle and every boot banner is captured — the C6's
# arrangement (#57), where the dongle's USB-CDC console re-enumerates on every
# reset and loses the first seconds of each boot. On cabot the Pi reads this UART
# anyway (M27).
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc: picolibc, matching the C6. The VM needs malloc/realloc/free, setjmp, snprintf
# and FP printf. The VM's own arena is the static oevm_heap_store (gc.c), sized by
# OEVM_HEAP_SIZE at build time — run.sh's profile defaults it to the C6's 131072; the
# measured link ceilings for this part's 520 KB are in
# docs/results/2026-10-01-rp2350-first-numbers.md.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# Hardware float ON. SOC_RP2350A_M33 selects CPU_HAS_FPU (single-precision FPv5);
# CONFIG_FPU is what actually emits VFP instructions and sets -mfloat-abi=hard. This
# is NOT oevm's first hard-float target — the nRF52840 (M4F) and the Xtensa ESP32
# both build with CONFIG_FPU=y; the C6 (rv32imac, no F/D) is the one without. What
# is new is a SINGLE-precision unit under a VM whose Float is a C double: every
# double op is still a libcall, so a float figure on the STIC table needs "FPv5-SP,
# double in software" on the row. FloatSmokeNode.nsl proves the path (#302 hazard 1).
CONFIG_FPU=y

# Net stack WITHOUT a radio driver — NOT optional, despite this board having no
# network peer and never getting one: zephyr/CMakeLists.txt adds src/udp.c, src/http.c,
# src/http_core.c and their zephyr backends to target_sources UNCONDITIONALLY, because
# dispatch.c's send() fast path probes `receiver == udp_object()` on every send.
# Without CONFIG_NET_SOCKETS the app fails to link on zsock_* undefined references.
# Same block and same reasoning as prj_esp32c6.conf; the pools are the C6's no-radio
# minimums because nothing but the loopback path can ever use them here.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# The net stack's sys_rand_get() needs a random source, and this tree has no entropy
# driver for the RP2350 (drivers/entropy/ has nothing rpi_pico-shaped; the C6 gets
# ENTROPY_GENERATOR for free from the ESP32 TRNG driver). Without a source the link
# fails on `undefined reference to z_impl_sys_rand_get` (measured, first trial build).
# The timer-based test generator is the degenerate case: nothing on this board ever
# sends a packet, so the quality of the number is irrelevant here — and it is NOT
# cryptographic, so the day a radio or a token lands on this part, a real entropy
# driver for the RP2350's TRNG has to come first.
CONFIG_TEST_RANDOM_GENERATOR=y

# Driver bring-up is otherwise SILENT (the C6 file's reasoning): this tree's device
# code uses printk with no CONFIG_LOG, so every LOG_ERR in a driver is compiled to
# nothing. MINIMAL mode is the cheap variant — no threads, no timestamps, no deferred
# backend — and it is what makes a driver fault legible on a board nobody has run yet.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- rete#215: the wedge detector's timeout path -----------------------------
# rpi_pico2.dtsi aliases watchdog0 = &wdt0 and sets it okay; CONFIG_WDT_RPI_PICO
# defaults y under CONFIG_WATCHDOG and selects HAS_WDT_DISABLE_AT_BOOT, so the driver
# hands observer_start() a watchdog that is off until it installs a timeout.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
# The HARDWARE window is MIN_TIMEOUT + HW_FALLBACK_DELAY (task_wdt.c:137-138) = 11 s,
# the C6's numbers, and they carry — but only just, and only on THIS part.
# wdt_rpi_pico.c refuses any window above RPI_PICO_MAX_WDT_TIME = 0xffffff µs (16.78 s)
# with -EINVAL, and on an RP2040 that ceiling is HALVED (errata RP2040-E1, 8.39 s) —
# so these same two lines on a Pico 1 would make task_wdt_init() fail and the
# observer print "wedge detection is OFF" once at boot, then run unguarded. The
# Kconfig help for WDT_RPI_PICO_INITIAL_TIMEOUT still quotes the RP2040 ceiling.
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# --- NO settings / NVS on this rung, and it is not a choice -------------------
# rete#302 Task 3 asked for a `settings` partition on the 4 MB QSPI so the node gets
# its per-boot counter (platform_zephyr.c, key "oevm/bootid"). It cannot land in this
# tree: drivers/flash/flash_rpi_pico.c is RP2040-only — it includes
# hardware/structs/ssi.h, which the pico-sdk ships under src/rp2040/ and not
# src/rp2350/ (the RP2350's controller is the QMI) — and the board's own
# rpi_pico2_rp2350a_m33.yaml lists no `flash` in `supported:` where rpi_pico.yaml
# does. MEASURED 2026-09-19: an overlay setting &qmi okay + CONFIG_FLASH=y selects
# FLASH_RPI_PICO and dies at `fatal error: hardware/structs/ssi.h: No such file`.
# So CONFIG_SETTINGS stays off, platform_backend_boot_id() takes its #else branch,
# and the node declares bootId 0 — the sentinel porta reads as "restart detection is
# unavailable for this node", visible at both ends rather than at neither. Earning it
# back is a flash driver for the QMI (upstream may already have one — check before
# writing), not an overlay.
