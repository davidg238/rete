# oevm/zephyr — ESP32-C6 (C6-DevKitC-1) boot-&-run Kconfig.
#
# Selected with:
#   bash zephyr/run.sh --board esp32c6 ...
# built against the upstream-Zephyr workspace ~/zephyr-esp32 (NOT NCS).
#
# The C6 counterpart to prj_esp32.conf. Three deliberate differences from the
# WROOM-32 config, each load-bearing:
#
# 1. NO CONFIG_FPU. The C6 ISA is rv32imac_zicsr
#    (dts/riscv/espressif/esp32c6/esp32c6_common.dtsi:37) — no 'f', no 'd'
#    extension, so there is no FPU. Every VM float becomes a soft-float libcall.
#    Accepted: this target is chosen for memory, not float throughput.
#
# 2. NO CONFIG_ESP32_USE_UNSUPPORTED_REVISION. That opt-in exists for the bench
#    WROOM-32's rev-1.0 Xtensa silicon; it is meaningless on the C6.
#
# 3. Net sockets (IPv6), but NO radio driver. The main app links src/udp.c,
#    src/http.c and src/http_core.c unconditionally (see the networking
#    comment near the bottom of this file), so CONFIG_NET_SOCKETS is not
#    optional here even though this target has no peer to talk to yet.
#    Task 6 layers prj_esp32c6_thread.conf on top for an OpenThread/IPv6
#    radio, together with a devicetree overlay enabling the ieee802154 node
#    (esp32c6_common.dtsi:85 ships it disabled). Thread rather than WiFi:
#    esp32c6_devkitc_hpcore.yaml declares 'netif:openthread' in its
#    supported: list and does NOT declare 'wifi'. WiFi is out of scope on
#    this board by decision (2026-07-20) — see #57.
#
# Console: the board DTS already routes zephyr,console = &uart0
# (esp32c6_devkitc_hpcore.dts:20), i.e. the CP210x UART bridge. That is what we
# want and needs no overlay. The bridge stays enumerated across target resets
# because the bridge chip never reboots, so a continuous log survives every
# reset — unlike the native USB port, which re-enumerates. Flashing uses the
# native port instead. See #57.
# rete#118: node id = eFuse base MAC via hwinfo (platform_zephyr.c; its #error fires without this).
CONFIG_HWINFO=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# rete#311: the console is also the debug transport's way IN (platform_zephyr.c,
# platform_debug_readline). Polled, the C6's UART hangs the board once the RX FIFO
# threshold fills (any unpaced line over ~24 chars) and the hardware watchdog resets it
# 22 s later; interrupt-driven it takes 400-char lines whole, and the ISR is what
# counts a line in while the program runs (dbg:pause). Every C6 image, the bell's
# included; a production image never arms the ISR, so it only pays the driver code.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_STDOUT_CONSOLE=y

# libc: picolibc, matching the ESP32 config. The VM needs malloc/realloc/free,
# setjmp, snprintf and FP printf. The VM's own arena is the static
# oevm_heap_store (gc.c:25), sized by OEVM_HEAP_SIZE at build time.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# Net stack WITHOUT a radio driver.
#
# NOT optional, despite this target having no network peer to talk to:
# zephyr/CMakeLists.txt adds src/udp.c, src/http.c, src/http_core.c and their
# zephyr backends to target_sources UNCONDITIONALLY, because dispatch.c's send()
# fast path probes `receiver == udp_object()` on every send. Without
# CONFIG_NET_SOCKETS the app fails to link on zsock_* undefined references.
# The same reasoning is recorded in prj_esp32.conf's networking comment.
#
# IPv6 rather than IPv4: the C6's radio path is Thread (prj_esp32c6_thread.conf),
# and Thread is IPv6-only. Keeping the base config IPv6 means the Thread layer
# adds a radio and nothing else.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n

# Small pools: this config has no radio, so nothing but the loopback path uses
# them. The Thread layer raises them.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# --- tuvm#100: the wall-clock seam — DS3231 over I2C ---------------------------
# The devicetree half is boards/esp32c6_devkitc_esp32c6_hpcore.overlay, which adds
# the maxim,ds3231-mfd parent + maxim,ds3231-rtc child on i2c0 and the `wallclock`
# alias the seam resolves. CONFIG_RTC_DS3231 is `default y` and depends on both
# DT_HAS_MAXIM_DS3231_MFD_ENABLED and DT_HAS_MAXIM_DS3231_RTC_ENABLED
# (drivers/rtc/Kconfig.ds3231), so the overlay is what actually switches it on;
# it is named here anyway so the dependency is visible at the config level rather
# than only in a generated .config.
CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_RTC_DS3231=y

# DELIBERATELY OFF until the INT/SQW wire exists. Either symbol makes
# rtc_ds3231_init() call rtc_ds3231_init_isw(), which configures the isw-gpios pin
# and returns -ENODEV if it is not ready — taking the whole RTC device down with
# it. Reading the time needs neither. Flip RTC_ALARM to y in the same commit that
# lands the alarm seam, not before.
CONFIG_RTC_ALARM=n
CONFIG_RTC_UPDATE=n

# Driver bring-up is otherwise SILENT: this tree's device code uses printk with no
# CONFIG_LOG, so every LOG_ERR in rtc_ds3231.c/mfd_ds3231.c (bad I2C address, NACK,
# ISW not ready) is compiled to nothing and a missing RTC looks identical to a
# working one that answers nil. MINIMAL mode is the cheap variant — no threads, no
# timestamps, no deferred backend — and it is what makes an I2C fault legible.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# So when a C6 with no DS3231 on the bus boots, it prints, before the Zephyr
# banner and every time:
#
#     E: Couldn't set control register.
#     E: Failed to init settings.
#
# That is rtc_ds3231_init_settings() failing its first write at 0x68 and is the
# REPORT, not a fault (#146, closed 2026-08-04 on the collector's own log: the
# boots before the bench board was changed print it, the boots after — on the
# board that carries the module — do not, and those set the wall clock and sync
# NTP). Do not silence it and do not gate the driver on a board revision: a
# missing part that says so is the whole point of the two lines above.

# --- rete#215: the wedge detector's timeout path -----------------------------
# wdt0 is `okay` on esp32c6_devkitc_hpcore.dts:72 and CONFIG_WDT_ESP32 defaults y
# once CONFIG_WATCHDOG is on, so this is the whole of it. HAS_WDT_DISABLE_AT_BOOT
# means the driver hands us a watchdog that is off until observer_start() sets it up.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
# The HARDWARE window is MIN_TIMEOUT + HW_FALLBACK_DELAY (task_wdt.c:137-138) = 11 s.
# Deliberately far above the observer's own 30 s backstop being reachable in normal
# operation: the hw watchdog is the LAST resort, for the kernel itself dying, and it
# resets with no dump at all. It is fed on every schedule_next_timeout(), which our 1 s
# feed triggers, so this costs no extra wakeups.
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# --- rete#329: -O2, not Zephyr's -Os default ----------------------------------
# Measured on #324: 1.14-1.40x per activation on Hanoi, richards and every blockcost
# row, for +35 kB flash and +5 kB sram0. The C6 only; the RP2350 waits on #296.
CONFIG_SPEED_OPTIMIZATIONS=y
