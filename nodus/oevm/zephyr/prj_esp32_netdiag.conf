# oevm/zephyr — #65 DIAGNOSTIC overlay for the ESP32 HTTP node. NOT a shipping
# config: it adds a thread that prints forever, and it buys the pool counters
# with RAM the node does not really have.
#
# Applied with:
#   OEVM_HEAP_SIZE=40960 bash run.sh --board esp32 --node ThermalHttpNode.nsl \
#       --model B --pristine --conf-extra prj_esp32_netdiag.conf
#
# The OEVM_HEAP_SIZE drop is NOT optional. prj_esp32.conf's default is 53248 and
# dram0 already sits at 99.89% / 224 B spare with the #65 net_mgmt handlers in
# (see #53); this overlay cannot fit beside it. 40960 is funded by measurement,
# not guessed: /stats on the running node reported live bytes 21,860 against a
# 53,248 arena. Heap high-water reads as the arena ceiling no matter what, because
# the GC is collect-when-full — so high-water is NOT evidence the node needs 52 KB.
# See the memory note on the VM memory model.
CONFIG_OEVM_NET_HEARTBEAT=y
CONFIG_OEVM_NET_HEARTBEAT_MS=2000

# The net_buf DATA pools only expose avail_count/max_used under this symbol; the
# net_pkt slabs are k_mem_slab and countable without it. Costs a few bytes per
# pool plus the accounting.
CONFIG_NET_BUF_POOL_USAGE=y

# Interactive introspection of a WEDGED node (#65 pass 2). The heartbeat proved
# the RX slab hits 0/8 and freezes with all 5 contexts pinned; the open question
# is what TCP state those connections are in, because that is what decides
# whether anything was ever going to time out and free them. `net conn` answers
# it directly (per-connection TCP state), and `net mem` / `net stats` cost
# nothing extra once the shell is in.
#
# The shell is the right tool rather than more printk because the question is not
# yet specific enough to pre-choose a field: at wedge time the node can be asked
# something it was not built to answer. It runs over the UART, NOT the network,
# so it still works when the node is unreachable — which is the entire point.
#
# Funded by dropping OEVM_HEAP_SIZE further (see the header): the shell plus the
# net command set is several KB, and dram0 has no slack of its own (#53).
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
