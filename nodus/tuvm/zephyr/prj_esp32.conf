# tuvm/zephyr — ESP32 (ESP32-D0WDQ6 / WROOM-32) boot-&-run Kconfig.
#
# Selected with:
#   west build -b esp32_devkitc/esp32/procpu -- -DCONF_FILE=prj_esp32.conf
# built against the upstream-Zephyr workspace ~/zephyr-esp32 (NOT NCS — ESP32 is
# first-class upstream, absent from NCS's manifest). This is the on-silicon
# counterpart to prj_dk.conf: the SAME engine + zephyr backend, console on
# uart0 (the CP210x USB-serial bridge, /dev/ttyUSB0 on the host), and Zephyr's
# REAL in-kernel UDP stack over a loopback interface.
#
# First target node is TimerNode (Rung-8 gate 1): it exercises the REAL
# k_timer ISR path (timer_zephyr.c) and needs NO radio and NO GPIO, so this
# config omits the DK's GPIO block. main.c's GPIO ISR is guarded on
# DT_ALIAS(pulsegpio) — absent here (no board overlay) — so it compiles out;
# OpenThread is guarded on CONFIG_NET_L2_OPENTHREAD (off here).

# Console on uart0 -> the devkit's CP210x USB-serial (/dev/ttyUSB0 on the host).
# esp32_devkitc's board DTS already chooses uart0 as zephyr,console; stated
# explicitly for provenance. Not USB-CDC (classic ESP32 has no native USB), so
# main.c's cdc_acm console branch compiles out.
# The bench board is an ESP32-D0WDQ6 rev v1.0 (early-2016 silicon). The
# hal_espressif SoC bootloader HALTS on rev 1.0 unless this opt-in is set —
# without it the app never gets control (bootloader stops at soc_init). Harmless
# on newer revisions.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# libc: picolibc (Zephyr's DEFAULT libc — lib/libc/Kconfig defaults PICOLIBC
# unless a target REQUIRES_FULL_LIBC). We deliberately do NOT reuse the nRF DK's
# CONFIG_NEWLIB_LIBC here. NOTE: an earlier revision of this comment blamed the
# 'TIMER OK' crash on newlib lazily mallocing the stream buffer, and claimed
# picolibc "doesn't have this gap". That was WRONG — picolibc crashed
# identically, because the choice of libc never mattered: the ESP32 ROM linker
# script esp32.rom.newlib-funcs.ld assigns `fflush` as a STRONG symbol (plain
# assignment, not PROVIDE — see that file's header comment, which says this is
# deliberate "so that ROM functions are always used instead of the ones provided
# by libc.a"). So fflush bound to ROM newlib no matter what, and ROM fflush
# calls ROM __getreent, which reads an ESP-IDF/FreeRTOS TCB reent pointer that
# does not exist under Zephyr -> NULL load -> EXCCAUSE 28. Verified by nm on
# zephyr.elf: `fflush` is absolute at 0x40059394 (ROM) while printf/fwrite/fputc
# resolve to picolibc at 0x400f____ — fflush was the ONLY stdio call tuvm made
# that appears on that forced list, which is why the text printed and then the
# flush faulted. Fixed at the source: platform_console_flush() is a no-op on
# Zephyr (stdout is _IONBF, so nothing is buffered) — see
# src/backend/zephyr/platform_zephyr.c. picolibc remains the right choice: the
# VM needs malloc/realloc/free, setjmp, snprintf and FP
# printf — all provided by picolibc (CONFIG_PICOLIBC_IO_FLOAT for %g/%f). The
# VM's own arena is the static oevm_heap_store (gc.c), sized by OEVM_HEAP_SIZE at
# build time; RAM tuning reuses the DK's proven env exports. ESP32 has an FPU.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FPU=y

# Networking: WiFi (2.4 GHz WROOM-32 radio) + TCP/IPv4 + DHCPv4 for the HTTP node.
# src/dispatch.c's send() fast path unconditionally probes
# `receiver == udp_object()`, so src/udp.c + src/backend/zephyr/udp_zephyr.c
# must LINK regardless; that path now rides the same WiFi interface as HTTP
# instead of loopback (#46 — see zephyr/src/backend/zephyr/http_zephyr.c and
# main.c's wifi_bringup()). NO CONFIG_POSIX_API: it exports a bare send() that
# collides with oevm's own send() dispatch function in dispatch.c.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
# tuvm#72: the VM's UDP backend binds AF_INET6 (udp_zephyr.c — IPv6-first for the
# Thread/6LoWPAN mesh). This wifi node's diag transport (gw -> node ctl) arrives over
# IPv4, so the v6 socket must accept v4-mapped (::ffff:a.b.c.d) datagrams. Without this
# the bind succeeds but IPv4 datagrams are silently never delivered — no code change,
# the send path already builds v4-mapped destinations.
CONFIG_NET_IPV4_MAPPING_TO_IPV6=y

# WiFi driver + the wifi_mgmt / net_mgmt request API used by wifi_bringup().
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y

# Net-buffer / context counts for a small TCP server. Starting point; trim or
# raise at bring-up if RAM is tight or connections stall (see the design risk).
# TRIMMED (2026-07-18, this task): the brief's starting values (8/8/8/16/16)
# overflowed DRAM by 4776 B once WiFi's own CONFIG_HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI
# (+40960 B system heap for the driver, ESP_WIFI_HEAP_SYSTEM default) is added on
# top of OEVM_HEAP_SIZE. Halved back to the values the pre-WiFi loopback config
# already proved boot clean at this same OEVM_HEAP_SIZE (run.sh's 65536) —
# net_buf pools (CONFIG_NET_BUF_DATA_SIZE=128) dominate the 4776 B, so RX/TX
# 16->8 alone recovers ~2.4 KB; PKT/context halving covers the rest.
# NET_MAX_CONTEXTS=5: 1 always-open listen socket (http_listen(), held for the
# VM's whole lifetime — see src/backend/zephyr/http_zephyr.c) + 4 in-flight
# accepted connections (OEVM_HTTP_INFLIGHT=4, src/http_backend.h). At =4 the
# listen socket alone left only ~3 contexts for accepted connections, and a
# context-exhausted zsock_accept() in http_poll() is indistinguishable from
# "nothing pending" (both take the same early return) — so a client would be
# silently dropped instead of hitting the ring's graceful 503 shed.
CONFIG_NET_MAX_CONTEXTS=5
# TIME_WAIT 1500 -> 250 ms (#65). Those 4 connection contexts are not freed at
# close: every reply is HTTP/1.0 + `Connection: close`, so the NODE is the active
# closer and parks each context in TIME_WAIT for the full delay. 4 contexts held
# 1500 ms each is a hard sustained ceiling of 4/1.5s = 2.67 requests/second, and
# every request above it is RST by the TCP stack BELOW zsock_accept() — so the
# ring's graceful 503 shed never sees it (that shed only fires for a connection
# already accepted; under connection-rate overload it is unreachable by
# construction). Measured on the WROOM-32 before the change, and this is the
# whole of the issue's rate table rather than two regimes: a quiesced node
# accepted exactly 4 back-to-back, refused everything for the next 1513 ms, then
# resumed — 1513 ms being TIME_WAIT to within the 150 ms probe granularity.
# Achieved throughput was pinned at 2.44-2.82/s at every offered rate from 4/s to
# unpaced, with ZERO failures below it.
# 250 ms restores 4/0.25s = ~16/s. The trade is TIME_WAIT's own purpose — guarding
# against delayed segments from a previous connection reusing the same 4-tuple —
# and Zephyr's Kconfig help sanctions exactly this trade for exactly this reason:
# "For low-resource systems, having large MSL may lead to quick resource
# exhaustion (and related DoS attacks)", noting the misdelivery risk "is largely
# alleviated in the modern TCP stacks by using random, non-repeating port numbers
# and initial sequence numbers". Zephyr's 1500 is already far below the RFC 793
# 2*MSL of 2 minutes for the same reason; this goes one step further on a LAN.
# Costs no RAM, which is why it is the first lever and not more contexts (#53:
# dram0 has 816 B spare). The protocol-level fix is keep-alive, which removes the
# per-request connection entirely — see #65.
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
# TCP keep-alive (#65) — the reaper for idle ESTABLISHED connections, and the one
# change that BREAKS the fatal deadlock rather than making it less likely.
# Measured on target: four un-accepted backlog connections sat in ESTABLISHED with
# the RX packet slab at 0/8, permanently. Without this symbol an idle ESTABLISHED
# connection has NO timer of any kind — not a slow timeout, none — so nothing was
# ever going to reclaim them and the node stayed deaf until a hardware reset.
# The per-connection timings are set in http_listen() rather than by the Kconfig
# defaults, which are useless here (idle 7200 s); see that comment for why the
# option must go on the LISTENING socket to reach a backlog entry at all.
CONFIG_NET_TCP_KEEPALIVE=y
# TX pool provisioned to serve a multi-KB body (the ~4 KB /thermal SVG): at the
# original 4 pkt / 8 buf the ESP32 TCP stack RST the connection mid-body (send
# returned ENOTCONN=128 after the first 512 B chunk). Funded by reverting the
# MAIN_STACK_SIZE bump (the crash was ROM setjmp, not stack). NET_BUF_DATA_SIZE 256
# so fewer bufs cover a full TCP window.
# RX descriptors 8 -> 16 (#65), restoring the value #46's RAM trim halved. This is
# the "raise the bar" lever, and it is deliberately taken IN ADDITION to the
# keep-alive reaper, not instead of it: more descriptors make the starvation
# window harder to reach, but only the reaper can end it once reached. Measured
# root cause was this slab hitting 0/8 with four backlogged connections pinning it,
# so the pool that the wedge exhausts is the one worth widening. Funded by the
# dram0 headroom the arena reduction freed (#53).
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_CONFIG_SETTINGS=n

# AMG8833 Grid-EYE thermal array (AMG88XX selects I2C). Phase 1 is poll-only: the
# cadence lives in nsl (ThermalNode's timer), so no driver trigger thread is needed
# and TRIGGER_NONE keeps the footprint down. Task 9 switches this to a trigger mode
# when the threshold event lands.
CONFIG_SENSOR=y
CONFIG_AMG88XX=y
CONFIG_AMG88XX_TRIGGER_NONE=y
