# rete#222 — the wedge-forensics overlay. Layer it on a scenario's own conf:
#
#   CONF_EXTRA="prj_esp32c6_thread.conf;prj_esp32c6_thread_ftd.conf;prj_esp32c6_forensics.conf"
#
# One symbol; its `select`s in zephyr/Kconfig pull in the four Zephyr options the dump
# needs (THREAD_MONITOR for the walk, THREAD_NAME to name what it finds, THREAD_STACK_INFO
# + INIT_STACKS for the headroom figure). Kept as an overlay rather than a scenario file so
# any scenario can be re-run with evidence and nothing else changed.
#
# VERIFY IT LANDED. An unmet `depends on` is discarded SILENTLY by Kconfig (the nRF52840
# lesson), and a forensics build whose symbol was dropped prints nothing at all — which
# reads exactly like a wedge that produced no evidence rather than a build that could not.
# Check the generated config, not this file:
#
#   grep TUVM_WEDGE_FORENSICS build-esp32c6-B/zephyr/.config
CONFIG_TUVM_WEDGE_FORENSICS=y
