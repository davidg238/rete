# Throwaway app: compiles tools/dump_layout.c for the ESP32-S2 ABI and prints the
# struct layout JSON over the console. Its output is banked as
# zephyr/layout-esp32s2.json and fed to the Model B bake as --layout.
#
# A separate file from prj.conf (the ESP32 one) for exactly one reason:
# CONFIG_ESP32_USE_UNSUPPORTED_REVISION is a WROOM-32 rev-1.0 opt-in and is not a
# symbol on the S2.
#
# Build/flash:
#   west build -b esp32s2_saola/esp32s2 -d build-layoutdump-s2 zephyr/layoutdump \
#     -- -DCONF_FILE=prj_esp32s2.conf
#
# Why generate this at all when layout-esp32.json and layout-esp32c6.json are
# byte-identical: that match is a coincidence of this struct set having no field
# whose natural alignment diverges between the two 32-bit ABIs, not a rule (see
# zephyr/README.md). run.sh fails loudly on a missing layout rather than reusing
# another target's, and the -m32 proxy was already found unsafe once
# (review/program-sequence.md:198).
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PICOLIBC=y
