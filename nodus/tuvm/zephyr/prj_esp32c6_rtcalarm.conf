# shipsBellsV3 (#102) — the DS3231 alarm as the strike trigger, layered ON TOP of
# prj_esp32c6.conf. Only ShipsBellAlarmNodeC6 needs it.
#
# Usage (fragments are semicolon-joined; LATER wins, so this must follow):
#   ./run.sh --board esp32c6 --node ShipsBellAlarmNodeC6.nsl \
#            --conf-extra "prj_esp32c6_thread.conf;prj_esp32c6_rtcalarm.conf" --flash
#
# WHY THIS IS A FRAGMENT AND NOT A FLIP OF prj_esp32c6.conf:92, which is what that
# line's own comment says to do. Turning RTC_ALARM on makes rtc_ds3231_init() call
# rtc_ds3231_init_isw(), which configures the isw-gpios pin (GPIO10 on this board)
# and returns -ENODEV if it is not ready — and that failure takes down the WHOLE RTC
# DEVICE, not just the alarm. In the base conf, a jumper coming off GPIO10 would
# therefore cost every C6 image its clock, including ShipsBellNodeC6, which polls and
# does not use the alarm at all. As a fragment the blast radius is one image, and the
# bell that is known to work stays bit-identical. Decided with David 2026-08-04.
#
# RTC_UPDATE stays n: it shares the same ISW plumbing but delivers a once-per-second
# tick, which is the 1 Hz-square-wave trigger §16.4 rejected — a poll loop wearing a
# hardware hat.
CONFIG_RTC_ALARM=y

# The alarm's INT/SQW edge arrives through the DS3231 driver's own GPIO callback and
# is handed to the system workqueue (rtc_ds3231_isw_isr -> k_work_submit), so the
# callback that posts into the VM runs in thread context. It still posts through
# pulse_post_isr, which is non-allocating either way.
