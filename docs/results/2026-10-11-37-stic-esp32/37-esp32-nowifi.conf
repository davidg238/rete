# rete#37 STIC on the plain ESP32: E4 (2026-07-16) ran with no WiFi and a 96 KB arena; prj_esp32.conf
# now pulls in WiFi (#46). Later wins in EXTRA_CONF_FILE, so these turn the six WiFi lines back off.
CONFIG_WIFI=n
CONFIG_WIFI_ESP32=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_REBOOT=y
