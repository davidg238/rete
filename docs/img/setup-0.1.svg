<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="690" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#111827">rete 0.1 setup: everything on one desk</text>

  <!-- dev machine -->
  <rect x="30" y="60" width="560" height="450" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="46" y="86" font-size="17" font-weight="bold" fill="#111827">Dev machine (Linux desktop)</text>

  <g font-size="13" fill="#111827">
    <rect x="50" y="102" width="230" height="56" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="62" y="125" font-size="15" font-weight="bold">You, or a coding agent</text>
    <text x="62" y="145">editor and shell</text>

    <rect x="50" y="172" width="230" height="56" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="62" y="195" font-size="15" font-weight="bold">nsl compiler</text>
    <text x="62" y="215">builds the program image</text>

    <rect x="50" y="242" width="230" height="74" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="62" y="265" font-size="15" font-weight="bold">Desktop VM</text>
    <text x="62" y="285">a node running on the desktop:</text>
    <text x="62" y="303">run and step through code</text>

    <rect x="50" y="330" width="230" height="56" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="62" y="353" font-size="15" font-weight="bold">Build and flash tool</text>
    <text x="62" y="373">zephyr/run.sh</text>

    <rect x="50" y="400" width="230" height="56" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="62" y="423" font-size="15" font-weight="bold">Console reader</text>
    <text x="62" y="443">reads what the board prints</text>
  </g>

  <!-- gateway group -->
  <rect x="356" y="180" width="212" height="250" rx="8" fill="#e5e7eb" stroke="#374151" stroke-dasharray="2 3"/>
  <text x="368" y="204" font-size="14" font-weight="bold" fill="#111827">Gateway (runs here too)</text>
  <g font-size="13" fill="#111827">
    <rect x="370" y="246" width="186" height="66" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="382" y="270" font-size="15" font-weight="bold">porta</text>
    <text x="382" y="291">stores each node's data</text>

    <rect x="370" y="334" width="186" height="80" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="382" y="358" font-size="15" font-weight="bold">custos</text>
    <text x="382" y="378">web front door:</text>
    <text x="382" y="396">docs and status page</text>
  </g>
  <!-- desktop VM <-> porta -->
  <line x1="280" y1="279" x2="370" y2="279" stroke="#111827" stroke-width="2"/>
  <polygon points="370,279 360,274 360,284" fill="#111827"/>
  <polygon points="280,279 290,274 290,284" fill="#111827"/>
  <text x="308" y="270" font-size="12" fill="#111827">UDP</text>

  <!-- board -->
  <rect x="770" y="110" width="296" height="270" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="786" y="136" font-size="17" font-weight="bold" fill="#111827">ESP32-C6 devkit</text>
  <text x="786" y="156" font-size="13" fill="#111827">has a radio; not used in 0.1</text>
  <g font-size="15" font-weight="bold" fill="#111827">
    <rect x="790" y="174" width="256" height="50" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="802" y="205">your nsl program</text>
    <rect x="790" y="236" width="256" height="50" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="802" y="267">nsl kernel</text>
    <rect x="790" y="298" width="256" height="62" rx="6" fill="#ffffff" stroke="#111827"/>
    <text x="802" y="324">oevm VM on Zephyr</text>
    <text x="802" y="345" font-size="13" font-weight="normal">the firmware</text>
  </g>

  <!-- USB cable -->
  <line x1="590" y1="250" x2="770" y2="250" stroke="#111827" stroke-width="7"/>
  <text x="618" y="236" font-size="15" font-weight="bold" fill="#111827">one USB cable</text>

  <!-- what rides the cable -->
  <text x="616" y="418" font-size="15" font-weight="bold" fill="#111827">Over the cable</text>
  <text x="616" y="440" font-size="13" fill="#111827">Today: flash the firmware, no button press needed</text>
  <text x="616" y="459" font-size="13" fill="#111827">Today: console text from the board</text>
  <text x="616" y="478" font-size="13" font-weight="bold" fill="#1d4ed8">0.1, to build: load a new nsl program without reflashing</text>
  <text x="616" y="497" font-size="13" font-weight="bold" fill="#1d4ed8">0.1, to build: debug, profile, patch a method</text>
  <text x="616" y="516" font-size="13" fill="#111827">A second cable, to the chip's own USB port, is optional</text>

  <!-- later -->
  <rect x="616" y="540" width="450" height="104" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="632" y="566" font-size="15" font-weight="bold" fill="#4b5563">Later (remote): the same board, over its radio</text>
  <text x="632" y="590" font-size="13" fill="#4b5563">reaches porta over Thread or Wi-Fi.</text>
  <text x="632" y="610" font-size="13" fill="#4b5563">Adds: program updates over the air, remote debug.</text>
  <text x="632" y="630" font-size="13" fill="#4b5563">The cable loop above stays the same.</text>
  <polyline points="616,592 580,592 580,279 556,279" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <polygon points="556,279 566,274 566,284" fill="#6b7280"/>

  <!-- legend -->
  <line x1="40" y1="560" x2="90" y2="560" stroke="#111827" stroke-width="3"/>
  <text x="102" y="565" font-size="13" fill="#111827">works today</text>
  <rect x="40" y="580" width="50" height="14" fill="#1d4ed8"/>
  <text x="102" y="592" font-size="13" fill="#111827">0.1: to build</text>
  <line x1="40" y1="614" x2="90" y2="614" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="102" y="619" font-size="13" fill="#111827">later</text>
  <text x="40" y="650" font-size="13" fill="#111827">In 0.1 the gateway talks to the desktop node only; the board is not on the network yet.</text>
</svg>
