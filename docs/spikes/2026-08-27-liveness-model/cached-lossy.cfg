\* The #272 review's F2, in 14 states. The rate rule as the Go of 2026-10-03 has it, on the
\* frame the node REALLY sends (pushFrame re-sends until acked, rete#199), for a node whose
\* reply spin fits inside its period (Cad = 2 x ReplyBudget — the 30 s nodes' shape). One
\* push is lost; the node never runs slow; the frame lands a period late carrying the count
\* from when it was built. Expected to violate NoFalseStall.
SPECIFICATION Spec
CONSTANTS
    Frame = "cached"  HealthGap = 2  ClearMark = FALSE
    Cad = 2  ReplyBudget = 1  Bud = 8  Sweep = 4  Slack = 8  Cap = 24  MaxBoots = 3  Rule = "rateAge"
INVARIANTS
    TypeOK
    NeverStaleLive
    NeverBehindLive
    NoFalseStall
