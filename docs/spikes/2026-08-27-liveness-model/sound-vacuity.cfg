\* THE CONSTRUCTIVE ONE. Same node, same detector, progressAge — but with the two
\* porta-side numbers chosen so that Bud + Sweep <= Cad * Slack. This is the
\* relation the other configs are missing, and it is the answer rete#273 wants:
\* porta's worst-case verdict age is its budget PLUS one sweep, and that sum is
\* what must fit inside the deadline the node itself enforces.
\*   Bud 4 (8 s) + Sweep 4 (8 s) = 8 = Cad 1 x Slack 8 (16 s).
SPECIFICATION Spec
CONSTANTS
    Cad         = 1
    ReplyBudget = 1
    Bud         = 4
    Sweep       = 4
    Slack       = 8
    Cap         = 24
    MaxBoots    = 3
    Rule        = "progressAge"
INVARIANTS
    LiveIsReachable
    TypeOK
    NeverStaleLive
