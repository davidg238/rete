\* A node on the COMPILED-IN DEFAULT: kernel.nsl:1705 ships cadMs 30000 /
\* budMs 240000. Scaled down proportionally to keep the state space finite —
\* what matters is the RELATION Bud >> reboot-loop gap, which is what the
\* default produces and what this config reproduces.
SPECIFICATION Spec
CONSTANTS
    Cad         = 1
    ReplyBudget = 1
    Bud         = 30    \* a budget far longer than the loop's silence gap
    Sweep       = 15
    Slack       = 8
    Cap         = 40
    MaxBoots    = 3
INVARIANTS
    TypeOK
    NeverStaleLive
