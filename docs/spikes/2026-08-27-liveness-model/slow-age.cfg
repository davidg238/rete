\* slow.cfg's node under rete#272's rule read as an AGE: `live` requires that the
\* node's own progress counter (obs/health.wak) has advanced RECENTLY — the exact
\* shape of the pulse_drained() fix, one layer up. Constants identical to bench.cfg.
SPECIFICATION Spec
CONSTANTS
    Cad         = 1     \* 2000 ms
    ReplyBudget = 1     \* 2000 ms per leg, kernel.nsl:1807
    Bud         = 30     \* 16000 ms — the node's declared budget
    Sweep       = 15    \* 30000 ms — porta's SweepTick, sweep.go:17
    Slack       = 8     \* WEDGE_SLACK, observer_core.h
    Cap         = 40
    MaxBoots    = 3
    Rule        = "progressAge"
INVARIANTS
    TypeOK
    NeverStaleLive
