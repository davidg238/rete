\* rete#272 D3 — the RATE rule on sound.cfg's numbers: live needs the arrival age
\* within Bud AND wak to have moved at the declared rate between porta's last two
\* samples; short by a whole period is "stalled". The outcome set now includes
\* "deaf" (lands, no reply — #271's 4.007 s against 2 s), which is the case the
\* arrival and age rules call live. Three claims, all expected to hold.
SPECIFICATION Spec
CONSTANTS
    Frame = "fresh"  HealthGap = 24  ClearMark = FALSE
    Cad         = 1
    ReplyBudget = 1
    Bud         = 4
    Sweep       = 4
    Slack       = 8
    Cap         = 24
    MaxBoots    = 3
    Rule        = "rateAge"
INVARIANTS
    TypeOK
    NeverStaleLive
    NeverBehindLive
    NoFalseStall
