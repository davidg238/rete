\* CONTROL for sound-rate.cfg: the age rule, same numbers, same invariants — it
\* has no stalled verdict, so a deaf node reads live and NeverBehindLive fails.
SPECIFICATION Spec
CONSTANTS
    Cad         = 1
    ReplyBudget = 1
    Bud         = 4
    Sweep       = 4
    Slack       = 8
    Cap         = 24
    MaxBoots    = 3
    Rule        = "progressAge"
INVARIANTS
    TypeOK
    NeverStaleLive
    NeverBehindLive
    NoFalseStall
