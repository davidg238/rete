\* The same with the Go's guard (unknown once the sample is one Cad older than the last
\* exchange). Still violates NeverBehindLive: a frame that was lost and lands late stamps an
\* OLD count with a NEW arrival time, the mark is late, the window is compressed, and a node
\* at half rate reads on-rate.
SPECIFICATION Spec
CONSTANTS
    Frame = "cached"  HealthGap = 1  ClearMark = FALSE
    Cad = 1  ReplyBudget = 1  Bud = 4  Sweep = 4  Slack = 8  Cap = 24  MaxBoots = 3  Rule = "rateAge"
INVARIANTS
    TypeOK
    NeverStaleLive
    NeverBehindLive
    NoFalseStall
