\* sound-rate.cfg's numbers on the cached frame, with NO guard on a missing sample. A deaf
\* node re-sends the frame porta already has, so no new sample ever lands and the empty-
\* window rule keeps live. Expected to violate NeverBehindLive.
SPECIFICATION Spec
CONSTANTS
    Frame = "cached"  HealthGap = 24  ClearMark = FALSE
    Cad = 1  ReplyBudget = 1  Bud = 4  Sweep = 4  Slack = 8  Cap = 24  MaxBoots = 3  Rule = "rateAge"
INVARIANTS
    TypeOK
    NeverStaleLive
    NeverBehindLive
    NoFalseStall
