\* The bench node as it actually flies: PortaBridgeNodeC6.nsl declares
\* cadence 2000 and budget cadence*8 = 16000. One model step = 2 s.
SPECIFICATION Spec
CONSTANTS
    Frame = "fresh"  HealthGap = 24  ClearMark = FALSE
    Cad         = 1     \* 2000 ms
    ReplyBudget = 1     \* 2000 ms per leg, kernel.nsl:1807
    Bud         = 8     \* 16000 ms — the node's declared budget
    Sweep       = 15    \* 30000 ms — porta's SweepTick, sweep.go:17
    Slack       = 8     \* WEDGE_SLACK, observer_core.h
    Cap         = 24
    MaxBoots    = 3
    Rule        = "arrival"   \* the rule as porta ships it
INVARIANTS
    TypeOK
    NeverStaleLive
